<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital — N-body XY modulator</title>
<style>
  :root{
    --sky:#141230;
    --sky-deep:#0d0b20;
    --ink:#efe9da;
    --ink-dim:#a49fb8;
    --line:#2c2950;
    --node-a:#f2a93b;
    --node-b:#7fd3e6;
    --node-c:#e8788a;
    --node-d:#b7d96b;
    --node-e:#c9a3ff;
    --node-f:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--sky);color:var(--ink);
    font:14px/1.45 "IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif}
  body{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100vh;overflow:hidden}
  @media (max-width:820px){body{grid-template-columns:1fr;grid-template-rows:60vh 1fr;overflow:auto}}

  /* ---- field ---- */
  #stage{position:relative;background:var(--sky-deep);display:flex;align-items:center;justify-content:center;overflow:hidden}
  #field{display:block;touch-action:none;cursor:crosshair;border-radius:2px}
  #hud{position:absolute;left:16px;top:14px;color:var(--ink-dim);font-size:12px;pointer-events:none;letter-spacing:.01em}
  #hud b{color:var(--ink);font-weight:500}
  #hint{position:absolute;left:16px;bottom:12px;color:var(--ink-dim);font-size:12px;pointer-events:none}

  /* ---- panel ---- */
  #panel{border-left:1px solid var(--line);overflow:auto;padding:18px 18px 40px;display:flex;flex-direction:column;gap:22px}
  h1{font-size:19px;font-weight:500;margin:0 0 2px;letter-spacing:-.01em}
  .sub{color:var(--ink-dim);margin:0;font-size:13px}
  .group{display:flex;flex-direction:column;gap:9px}
  .group h2{font-size:13px;font-weight:500;color:var(--ink-dim);margin:0;display:flex;justify-content:space-between;align-items:baseline}
  .row{display:grid;grid-template-columns:82px 1fr 48px;align-items:center;gap:8px;font-size:13px}
  .row output{text-align:right;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--ink);height:18px;margin:0;background:transparent}
  select,button{font:inherit;color:var(--ink);background:var(--sky);border:1px solid var(--line);border-radius:3px;padding:4px 7px}
  select{width:100%}
  button{cursor:pointer}
  button:hover{border-color:var(--ink-dim)}
  button.primary{background:var(--ink);color:var(--sky-deep);border-color:var(--ink);font-weight:500}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btns button{flex:1}
  label.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-dim)}
  label.chk input{accent-color:var(--ink)}
  :focus-visible{outline:2px solid var(--node-b);outline-offset:2px}

  /* ---- node cards ---- */
  .node{border-left:3px solid var(--c);padding:6px 0 8px 10px;display:flex;flex-direction:column;gap:6px}
  .node .head{display:flex;align-items:center;gap:8px}
  .node .head .name{font-weight:500;flex:1}
  .node .head .xy{color:var(--ink-dim);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .node .head button{padding:1px 7px;font-size:12px;color:var(--ink-dim)}
  .node .map{display:grid;grid-template-columns:14px 1fr;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink-dim)}
  .node .row{grid-template-columns:40px 1fr 40px}
  /* value column wide enough for "4925 Hz" on one line: a wrap here reflowed the
     whole panel every frame the value crossed 1000 (human 2026-09-15) */
  .node .out{display:grid;grid-template-columns:14px 1fr 64px;gap:4px 8px;font-size:12px;color:var(--ink-dim);align-items:center}
  .node .out [data-val]{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  .node .xyg{display:block;width:100%;height:44px;border-radius:4px;background:rgba(128,128,128,.08)}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--c)}
</style>
</head>
<body>

<div id="stage">
  <canvas id="field"></canvas>
  <div id="hud"><b id="hud-t">0.0</b> s &nbsp; <span id="hud-e"></span></div>
  <div id="hint">Drag a node to move it, release with motion to throw it. Double-click empty space to add a node there.</div>
</div>

<aside id="panel">
  <div>
    <h1>Orbital</h1>
    <p class="sub">Nodes fall toward each other. Where they end up is the modulation.</p>
  </div>

  <div class="btns">
    <button id="audio" class="primary">Start sound</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>

  <div class="group">
    <h2>Universe</h2>
    <div class="row"><span>Gravity</span><input id="G" type="range" min="-3" max="0" step="0.01" value="-1.6"><output id="G-o"></output></div>
    <div class="row"><span>Softening</span><input id="eps" type="range" min="0.01" max="0.3" step="0.005" value="0.06"><output id="eps-o"></output></div>
    <div class="row"><span>Time scale</span><input id="ts" type="range" min="0" max="3" step="0.01" value="1"><output id="ts-o"></output></div>
    <div class="row"><span>Drag</span><input id="damp" type="range" min="0" max="1" step="0.01" value="0"><output id="damp-o"></output></div>
    <!-- ADR-165 A1 (2026-09-15): the EDGE CUSHION — a drag band that rises
         smoothly toward each wall and slows orbits that get too extreme. A
         damping, not a potential: it only touches what reaches the band. -->
    <div class="row"><span>Cushion</span><input id="cushK" type="range" min="0" max="1" step="0.01" value="0"><output id="cushK-o"></output></div>
    <div class="row"><span>Cushion width</span><input id="cushW" type="range" min="0.02" max="0.3" step="0.005" value="0.1"><output id="cushW-o"></output></div>
    <div class="row"><span>Edges</span><select id="bounds"><option value="reflect">Bounce, elastic</option><option value="wrap">Wrap around</option><option value="open">Open, output clamped</option></select><span></span></div>
    <label class="chk"><input id="com" type="checkbox" checked> Keep center of mass at center</label>
    <label class="chk"><input id="trails" type="checkbox" checked> Show trails</label>
    <!-- 2026-09-15 (human): the body graphs in polar — angle about the field
         centre (the spec's `angle` observable) and radius from it — or x/y. -->
    <label class="chk"><input id="polar" type="checkbox"> Polar graphs (angle · radius)</label>
  </div>

  <div class="group">
    <h2>Nodes <button id="add" style="font-size:12px;padding:2px 8px">Add node</button></h2>
    <div id="nodes"></div>
  </div>

  <div class="group">
    <h2>Presets</h2>
    <div class="btns">
      <button data-preset="binary">Binary</button>
      <button data-preset="sun">Sun + planets</button>
      <button data-preset="figure8">Figure eight</button>
      <button data-preset="chaos">Four-body chaos</button>
    </div>
  </div>
</aside>

<script>
/* ---------------------------------------------------------------- targets
   Each node maps its normalized x and y (0..1) onto one audio parameter each.
   ---------------------------------------------------------------- */
const TARGETS = {
  none:     {label:'—',              apply:()=>{}},
  cutoff:   {label:'Filter cutoff',  fmt:v=>Math.round(80*Math.pow(100,v))+' Hz',
             apply:(a,v)=>a.filter.frequency.setTargetAtTime(80*Math.pow(100,v),a.ctx.currentTime,0.02)},
  q:        {label:'Filter resonance', fmt:v=>(v*18).toFixed(1),
             apply:(a,v)=>a.filter.Q.setTargetAtTime(0.5+v*18,a.ctx.currentTime,0.02)},
  pitch:    {label:'Pitch (±12 st)',  fmt:v=>((v-0.5)*24).toFixed(1)+' st',
             apply:(a,v)=>{const f=55*Math.pow(2,(v-0.5)*2);a.osc1.frequency.setTargetAtTime(f,a.ctx.currentTime,0.03);a.osc2.frequency.setTargetAtTime(f*1.005,a.ctx.currentTime,0.03)}},
  detune:   {label:'Detune (cents)',  fmt:v=>Math.round(v*60)+' ¢',
             apply:(a,v)=>a.osc2.detune.setTargetAtTime(v*60,a.ctx.currentTime,0.02)},
  pan:      {label:'Pan',             fmt:v=>(v<0.5?'L':'R')+Math.abs(Math.round((v-0.5)*200)),
             apply:(a,v)=>a.pan.pan.setTargetAtTime(v*2-1,a.ctx.currentTime,0.02)},
  delay:    {label:'Delay time',      fmt:v=>Math.round(20+v*580)+' ms',
             apply:(a,v)=>a.delay.delayTime.setTargetAtTime(0.02+v*0.58,a.ctx.currentTime,0.05)},
  feedback: {label:'Delay feedback',  fmt:v=>Math.round(v*85)+'%',
             apply:(a,v)=>a.fb.gain.setTargetAtTime(v*0.85,a.ctx.currentTime,0.02)},
  wet:      {label:'Delay mix',       fmt:v=>Math.round(v*100)+'%',
             apply:(a,v)=>a.wet.gain.setTargetAtTime(v*0.8,a.ctx.currentTime,0.02)},
  lfo:      {label:'Tremolo rate',    fmt:v=>(0.1+v*11.9).toFixed(1)+' Hz',
             apply:(a,v)=>a.lfo.frequency.setTargetAtTime(0.1+v*11.9,a.ctx.currentTime,0.05)},
  lfoDepth: {label:'Tremolo depth',   fmt:v=>Math.round(v*100)+'%',
             apply:(a,v)=>a.lfoGain.gain.setTargetAtTime(v*0.5,a.ctx.currentTime,0.05)},
};

/* ---------------------------------------------------------------- audio */
let A=null;
function buildAudio(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc1=ctx.createOscillator(); osc1.type='sawtooth'; osc1.frequency.value=55;
  const osc2=ctx.createOscillator(); osc2.type='sawtooth'; osc2.frequency.value=55.3; osc2.detune.value=8;
  const filter=ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=800; filter.Q.value=4;
  const trem=ctx.createGain(); trem.gain.value=1;
  const lfo=ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=2;
  const lfoGain=ctx.createGain(); lfoGain.gain.value=0;
  lfo.connect(lfoGain).connect(trem.gain);
  const delay=ctx.createDelay(1); delay.delayTime.value=0.3;
  const fb=ctx.createGain(); fb.gain.value=0.35;
  const wet=ctx.createGain(); wet.gain.value=0.3;
  const pan=ctx.createStereoPanner();
  const master=ctx.createGain(); master.gain.value=0.22;
  osc1.connect(filter); osc2.connect(filter);
  filter.connect(trem);
  trem.connect(pan);
  trem.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(pan);
  pan.connect(master).connect(ctx.destination);
  osc1.start(); osc2.start(); lfo.start();
  return {ctx,osc1,osc2,filter,trem,lfo,lfoGain,delay,fb,wet,pan,master};
}

/* ---------------------------------------------------------------- state */
const COLORS=['--node-a','--node-b','--node-c','--node-d','--node-e','--node-f'];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let nodes=[];            // {id,name,color,m,x,y,vx,vy,pinned,tx,ty,trail:[]}
let uid=0, simTime=0, paused=false, lastFrame=null;
const P={G:0.025,eps:0.06,ts:1,damp:0,bounds:'reflect',com:true,trails:true,cushW:0.1,cushK:0,polar:false};   // cushK 0 = off (ADR-165 A1)
const MAXV=3.0;

function mk(o){
  const n=Object.assign({id:uid++,name:'Node',m:1,x:0.5,y:0.5,vx:0,vy:0,pinned:false,tx:'none',ty:'none',trail:[],hx:new Float32Array(240),hy:new Float32Array(240),ha:new Float32Array(240),hr:new Float32Array(240),hp:0},o);
  n.color=n.color||COLORS[nodes.length%COLORS.length];
  n.name=o.name||'Node '+(nodes.length+1);
  return n;
}

const PRESETS={
  binary(){ return [
    mk({name:'Alpha',m:3,x:0.38,y:0.5,vx:0,vy:-0.28,tx:'cutoff',ty:'q'}),
    mk({name:'Beta', m:3,x:0.62,y:0.5,vx:0,vy: 0.28,tx:'pan',ty:'delay'}),
  ]},
  sun(){ return [
    mk({name:'Sun',   m:8,x:0.5,y:0.5,pinned:true,tx:'none',ty:'none'}),
    mk({name:'Inner', m:0.4,x:0.5,y:0.32,vx:0.62,vy:0,tx:'cutoff',ty:'q'}),
    mk({name:'Outer', m:0.6,x:0.5,y:0.86,vx:-0.42,vy:0,tx:'pan',ty:'detune'}),
    mk({name:'Comet', m:0.15,x:0.12,y:0.15,vx:0.35,vy:0.12,tx:'delay',ty:'feedback'}),
  ]},
  figure8(){ // Chenciner–Montgomery orbit, scaled into the box
    const s=0.28, v=Math.sqrt(0.05/s); // G=0.05, m=1: v' = v·√(G/s)
    return [
      mk({name:'One',  m:1,x:0.5+0.97000436*s,y:0.5-0.24308753*s,vx:0.46620369*v,vy:0.43236573*v,tx:'cutoff',ty:'q'}),
      mk({name:'Two',  m:1,x:0.5-0.97000436*s,y:0.5+0.24308753*s,vx:0.46620369*v,vy:0.43236573*v,tx:'pan',ty:'delay'}),
      mk({name:'Three',m:1,x:0.5,y:0.5,vx:-0.93240737*v,vy:-0.86473146*v,tx:'feedback',ty:'lfo'}),
    ]},
  chaos(){ return [
    mk({name:'Ares',  m:1.2,x:0.25,y:0.25,vx:0.1,vy:0.05,tx:'cutoff',ty:'q'}),
    mk({name:'Hera',  m:0.8,x:0.75,y:0.3,vx:-0.05,vy:0.15,tx:'pan',ty:'wet'}),
    mk({name:'Zeus',  m:2.0,x:0.6,y:0.72,vx:0,vy:-0.1,tx:'delay',ty:'feedback'}),
    mk({name:'Iris',  m:0.5,x:0.2,y:0.7,vx:0.2,vy:-0.1,tx:'lfo',ty:'lfoDepth'}),
  ]},
};

function load(name){
  nodes=[]; nodes=PRESETS[name]();
  if(name==='figure8'){P.G=0.05;P.eps=0.01;P.bounds='open';P.com=true;}
  else {P.G=0.025;P.eps=0.06;P.bounds='reflect';P.com=name!=='sun';}
  syncControls(); simTime=0; renderNodeList();
}

/* ---------------------------------------------------------------- physics */
function accel(){
  const n=nodes.length;
  for(const b of nodes){b.ax=0;b.ay=0;}
  const e2=P.eps*P.eps;
  for(let i=0;i<n;i++){
    const a=nodes[i];
    for(let j=i+1;j<n;j++){
      const b=nodes[j];
      let dx=b.x-a.x, dy=b.y-a.y;
      if(P.bounds==='wrap'){ if(dx>0.5)dx-=1; if(dx<-0.5)dx+=1; if(dy>0.5)dy-=1; if(dy<-0.5)dy+=1; }
      const r2=dx*dx+dy*dy+e2;
      const inv=P.G/(r2*Math.sqrt(r2));
      a.ax+=dx*inv*b.m; a.ay+=dy*inv*b.m;
      b.ax-=dx*inv*a.m; b.ay-=dy*inv*a.m;
    }
  }
}

function step(dt){
  // velocity Verlet (kick–drift–kick)
  accel();
  for(const b of nodes){ if(b.pinned||b.drag)continue; b.vx+=0.5*b.ax*dt; b.vy+=0.5*b.ay*dt; }
  for(const b of nodes){
    if(b.pinned||b.drag)continue;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
  }
  accel();
  for(const b of nodes){
    if(b.pinned||b.drag)continue;
    b.vx+=0.5*b.ax*dt; b.vy+=0.5*b.ay*dt;
    if(P.damp>0){const k=Math.exp(-P.damp*3*dt);b.vx*=k;b.vy*=k;}
    if(P.cushK>0 && P.bounds!=='wrap'){
      // edge cushion: distance to the nearest wall, quadratic ramp inside the band
      const d=Math.min(b.x,1-b.x,b.y,1-b.y), u=Math.max(0,1-d/P.cushW);
      if(u>0){const k=Math.exp(-P.cushK*12*u*u*dt);b.vx*=k;b.vy*=k;}
    }
    const s=Math.hypot(b.vx,b.vy); if(s>MAXV){b.vx*=MAXV/s;b.vy*=MAXV/s;}
    if(P.bounds==='reflect'){
      if(b.x<0){b.x=-b.x;b.vx=Math.abs(b.vx);} else if(b.x>1){b.x=2-b.x;b.vx=-Math.abs(b.vx);}
      if(b.y<0){b.y=-b.y;b.vy=Math.abs(b.vy);} else if(b.y>1){b.y=2-b.y;b.vy=-Math.abs(b.vy);}
    } else if(P.bounds==='wrap'){
      b.x=((b.x%1)+1)%1; b.y=((b.y%1)+1)%1;
    }
  }
  if(P.com && P.bounds!=='wrap'){
    let M=0,cx=0,cy=0,vx=0,vy=0;
    for(const b of nodes){ if(b.pinned)continue; M+=b.m; cx+=b.x*b.m; cy+=b.y*b.m; vx+=b.vx*b.m; vy+=b.vy*b.m; }
    if(M>0 && !nodes.some(b=>b.pinned)){
      cx/=M;cy/=M;vx/=M;vy/=M;
      for(const b of nodes){ if(b.drag)continue; b.x+=0.5-cx; b.y+=0.5-cy; b.vx-=vx; b.vy-=vy; }
    }
  }
  simTime+=dt;
}

function energy(){
  let K=0,U=0;
  for(const b of nodes){K+=0.5*b.m*(b.vx*b.vx+b.vy*b.vy);}
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    const r=Math.hypot(b.x-a.x,b.y-a.y);
    U-=P.G*a.m*b.m/Math.sqrt(r*r+P.eps*P.eps);
  }
  return {K,U};
}

/* ---------------------------------------------------------------- output */
const clamp01=v=>Math.max(0,Math.min(1,v));
function outX(b){return clamp01(b.x)}
// polar observables about the field centre: angle 0..1 wrapping (the spec's
// `angle`), radius 0..1 with 1 = the corner distance (sqrt(0.5))
function outAngle(b){return (Math.atan2(0.5-b.y,b.x-0.5)/(2*Math.PI)+1)%1}
function outRadius(b){return clamp01(Math.hypot(b.x-0.5,b.y-0.5)/Math.SQRT1_2)}
function outY(b){return clamp01(1-b.y)}   // up on screen = higher value

function applyModulation(){
  if(!A)return;
  for(const b of nodes){
    TARGETS[b.tx].apply(A,outX(b));
    TARGETS[b.ty].apply(A,outY(b));
  }
}

/* ---------------------------------------------------------------- drawing */
const cv=document.getElementById('field'), cx=cv.getContext('2d');
let S=600, dpr=1;
function resize(){
  const st=document.getElementById('stage');
  S=Math.min(st.clientWidth,st.clientHeight)-24;
  dpr=window.devicePixelRatio||1;
  cv.width=S*dpr; cv.height=S*dpr; cv.style.width=S+'px'; cv.style.height=S+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize); resize();

function radius(b){return 4+Math.sqrt(b.m)*5}

function draw(){
  cx.fillStyle=css('--sky-deep'); cx.fillRect(0,0,S,S);
  // grid
  cx.strokeStyle=css('--line'); cx.lineWidth=1;
  for(let i=1;i<8;i++){const p=i*S/8+0.5;cx.beginPath();cx.moveTo(p,0);cx.lineTo(p,S);cx.moveTo(0,p);cx.lineTo(S,p);cx.stroke();}
  cx.strokeStyle=css('--ink-dim'); cx.globalAlpha=0.35;
  cx.beginPath();cx.moveTo(S/2+0.5,0);cx.lineTo(S/2+0.5,S);cx.moveTo(0,S/2+0.5);cx.lineTo(S,S/2+0.5);cx.stroke();
  cx.globalAlpha=1;

  // force lines
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    if(P.bounds==='wrap' && (Math.abs(a.x-b.x)>0.5||Math.abs(a.y-b.y)>0.5))continue;
    const r=Math.hypot(b.x-a.x,b.y-a.y);
    const f=P.G*a.m*b.m/(r*r+P.eps*P.eps);
    const al=Math.min(0.5,f*2.2);
    if(al<0.02)continue;
    cx.strokeStyle=css('--ink'); cx.globalAlpha=al; cx.lineWidth=0.5+al*2;
    cx.beginPath();cx.moveTo(a.x*S,a.y*S);cx.lineTo(b.x*S,b.y*S);cx.stroke();
  }
  cx.globalAlpha=1;

  // trails
  if(P.trails) for(const b of nodes){
    const col=css(b.color);
    cx.strokeStyle=col; cx.lineWidth=1.2;
    const t=b.trail; if(t.length<2)continue;
    for(let i=1;i<t.length;i++){
      const p=t[i-1],q=t[i];
      if(Math.abs(p[0]-q[0])>0.5||Math.abs(p[1]-q[1])>0.5)continue;
      cx.globalAlpha=(i/t.length)*0.55;
      cx.beginPath();cx.moveTo(p[0]*S,p[1]*S);cx.lineTo(q[0]*S,q[1]*S);cx.stroke();
    }
  }
  cx.globalAlpha=1;

  // nodes
  for(const b of nodes){
    const col=css(b.color), r=radius(b), X=b.x*S, Y=b.y*S;
    // glow
    const g=cx.createRadialGradient(X,Y,r*0.5,X,Y,r*4);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    cx.globalAlpha=0.18; cx.fillStyle=g; cx.beginPath();cx.arc(X,Y,r*4,0,7);cx.fill(); cx.globalAlpha=1;
    // projection ticks onto axes
    cx.strokeStyle=col; cx.lineWidth=2;
    cx.beginPath();cx.moveTo(X,S-1);cx.lineTo(X,S-9);cx.moveTo(1,Y);cx.lineTo(9,Y);cx.stroke();
    // body
    cx.fillStyle=col; cx.beginPath();cx.arc(X,Y,r,0,7);cx.fill();
    if(b.pinned){cx.strokeStyle=css('--sky-deep');cx.lineWidth=2;cx.beginPath();cx.arc(X,Y,r*0.45,0,7);cx.stroke();}
    cx.fillStyle=css('--ink'); cx.font='12px IBM Plex Sans, Helvetica, sans-serif'; cx.globalAlpha=0.8;
    cx.fillText(b.name,X+r+5,Y+4); cx.globalAlpha=1;
  }
}

/* ---------------------------------------------------------------- loop */
let acc=0; const DT=1/480;
function frame(t){
  if(lastFrame==null)lastFrame=t;
  let real=Math.min(0.05,(t-lastFrame)/1000); lastFrame=t;
  if(!paused){
    acc+=real*P.ts;
    let n=0;
    while(acc>=DT && n<200){step(DT);acc-=DT;n++;}
    if(n>=200)acc=0;
    for(const b of nodes){ b.trail.push([b.x,b.y]); if(b.trail.length>220)b.trail.shift();
      b.hx[b.hp]=outX(b); b.hy[b.hp]=outY(b); b.ha[b.hp]=outAngle(b); b.hr[b.hp]=outRadius(b); b.hp=(b.hp+1)%b.hx.length; }   // per-body histories (2026-09-15)
  }
  applyModulation();
  draw();
  updateReadouts();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------------------------------------------------------- interaction */
let dragging=null, dragHist=[];
function toNorm(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
cv.addEventListener('pointerdown',e=>{
  const [x,y]=toNorm(e);
  let best=null,bd=1e9;
  for(const b of nodes){const d=Math.hypot(b.x-x,b.y-y)*S; if(d<radius(b)+8 && d<bd){bd=d;best=b;}}
  if(best){dragging=best;best.drag=true;dragHist=[[x,y,performance.now()]];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';}
});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const [x,y]=toNorm(e); dragging.x=x; dragging.y=y;
  dragHist.push([x,y,performance.now()]); if(dragHist.length>6)dragHist.shift();
});
cv.addEventListener('pointerup',e=>{
  if(!dragging)return;
  const h=dragHist; 
  if(h.length>=2){
    const a=h[0],b=h[h.length-1]; const dt=(b[2]-a[2])/1000;
    if(dt>0.005 && !dragging.pinned){dragging.vx=(b[0]-a[0])/dt*0.6;dragging.vy=(b[1]-a[1])/dt*0.6;}
  }
  dragging.drag=false; dragging.trail=[]; dragging=null; cv.style.cursor='crosshair';
});
cv.addEventListener('dblclick',e=>{
  const [x,y]=toNorm(e);
  if(nodes.some(b=>Math.hypot(b.x-x,b.y-y)*S<radius(b)+8))return;
  nodes.push(mk({x,y,m:0.8})); renderNodeList();
});

/* ---------------------------------------------------------------- controls */
const $=id=>document.getElementById(id);
function bind(id,key,map,fmt){
  const el=$(id),o=$(id+'-o');
  const show=()=>{o.textContent=fmt(map(+el.value))};
  el.addEventListener('input',()=>{P[key]=map(+el.value);show();});
  return show;
}
const showers=[
  bind('G','G',v=>Math.pow(10,v),v=>v.toFixed(3)),
  bind('eps','eps',v=>v,v=>v.toFixed(3)),
  bind('ts','ts',v=>v,v=>v.toFixed(2)+'×'),
  bind('damp','damp',v=>v,v=>v.toFixed(2)),
  bind('cushK','cushK',v=>v,v=>v.toFixed(2)),
  bind('cushW','cushW',v=>v,v=>v.toFixed(3)),
];
$('bounds').addEventListener('change',e=>P.bounds=e.target.value);
$('com').addEventListener('change',e=>P.com=e.target.checked);
$('trails').addEventListener('change',e=>P.trails=e.target.checked);
$('polar').addEventListener('change',e=>P.polar=e.target.checked);
function syncControls(){
  $('G').value=Math.log10(P.G); $('eps').value=P.eps; $('ts').value=P.ts; $('damp').value=P.damp;
  $('cushK').value=P.cushK; $('cushW').value=P.cushW;
  $('bounds').value=P.bounds; $('com').checked=P.com; $('trails').checked=P.trails; $('polar').checked=P.polar;
  showers.forEach(f=>f());
}
$('pause').addEventListener('click',e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';});
$('reset').addEventListener('click',()=>load(currentPreset));
/* ADR-165's one sanctioned edit: the add-body position is an INITIAL
   CONDITION (patch state), so it draws from a seeded mulberry32 stream —
   the byte-identical form the design labs carry — not Math.random. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let addSeed=1024, addRng=mulberry32(addSeed);
$('add').addEventListener('click',()=>{nodes.push(mk({x:0.2+addRng()*0.6,y:0.2+addRng()*0.6,m:0.8}));renderNodeList();});
let currentPreset='sun';
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{currentPreset=b.dataset.preset;load(currentPreset);}));
$('audio').addEventListener('click',async e=>{
  if(!A){A=buildAudio();}
  if(A.ctx.state==='suspended'){await A.ctx.resume();e.target.textContent='Mute';}
  else {await A.ctx.suspend();e.target.textContent='Start sound';}
});

/* ---------------------------------------------------------------- node list */
function targetOptions(sel){
  return Object.entries(TARGETS).map(([k,t])=>`<option value="${k}"${k===sel?' selected':''}>${t.label}</option>`).join('');
}
function renderNodeList(){
  const host=$('nodes'); host.innerHTML='';
  nodes.forEach(b=>{
    const el=document.createElement('div'); el.className='node'; el.style.setProperty('--c',css(b.color)); el.dataset.id=b.id;
    el.innerHTML=`
      <div class="head">
        <span class="name" contenteditable spellcheck="false">${b.name}</span>
        <span class="xy"></span>
        <button data-act="pin" title="Pin in place">${b.pinned?'Pinned':'Pin'}</button>
        <button data-act="del" title="Remove">×</button>
      </div>
      <div class="row"><span>Mass</span><input data-act="mass" type="range" min="-1" max="1.2" step="0.01" value="${Math.log10(b.m)}"><output>${b.m.toFixed(2)}</output></div>
      <div class="map"><span>x</span><select data-act="tx">${targetOptions(b.tx)}</select><span>y</span><select data-act="ty">${targetOptions(b.ty)}</select></div>
      <div class="out"><span>x</span><div class="bar"><i data-bar="x"></i></div><span data-val="x"></span>
                       <span>y</span><div class="bar"><i data-bar="y"></i></div><span data-val="y"></span></div>
      <canvas class="xyg" width="240" height="44" title="x (solid) and y (dashed) over the last few seconds"></canvas>`;
    el.querySelector('.name').addEventListener('input',e=>b.name=e.target.textContent.trim()||'Node');
    el.querySelector('[data-act=mass]').addEventListener('input',e=>{b.m=Math.pow(10,+e.target.value);e.target.nextElementSibling.textContent=b.m.toFixed(2);});
    el.querySelector('[data-act=tx]').addEventListener('change',e=>b.tx=e.target.value);
    el.querySelector('[data-act=ty]').addEventListener('change',e=>b.ty=e.target.value);
    el.querySelector('[data-act=pin]').addEventListener('click',e=>{b.pinned=!b.pinned;if(b.pinned){b.vx=b.vy=0;}e.target.textContent=b.pinned?'Pinned':'Pin';});
    el.querySelector('[data-act=del]').addEventListener('click',()=>{nodes=nodes.filter(n=>n!==b);renderNodeList();});
    host.appendChild(el);
  });
}
/* Per-body x/y position graphs (human 2026-09-15): the two observables as
   strips over the last 240 frames, x solid, y dashed, in the body's colour —
   the visible link between the orbit and the modulation it emits. */
function drawXYGraph(cv, b){
  if(!cv) return;
  const g=cv.getContext('2d'), w=cv.width, h=cv.height, n=b.hx.length;
  g.clearRect(0,0,w,h);
  g.strokeStyle='rgba(128,128,128,.25)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,h/2+.5); g.lineTo(w,h/2+.5); g.stroke();
  const c=css(b.color);
  cv.title=P.polar?'angle (solid, wraps) and radius (dashed) about the field centre':'x (solid) and y (dashed) over the last few seconds';
  for(const [arr,dash] of (P.polar?[[b.ha,[]],[b.hr,[3,3]]]:[[b.hx,[]],[b.hy,[3,3]]])){
    g.setLineDash(dash); g.strokeStyle=c; g.lineWidth=1.4; g.beginPath();
    let pv=null;
    for(let i=0;i<n;i++){ const v=arr[(b.hp+i)%n]; const x=i/(n-1)*w, y=h-2-v*(h-4);
      const seam=P.polar&&arr===b.ha&&pv!==null&&Math.abs(v-pv)>0.5;   // the angle wrapped: lift the pen
      if(i&&!seam)g.lineTo(x,y); else g.moveTo(x,y); pv=v; }
    g.stroke();
  }
  g.setLineDash([]);
}
function updateReadouts(){
  for(const el of $('nodes').children){
    const b=nodes.find(n=>n.id==el.dataset.id); if(!b)continue;
    const x=outX(b),y=outY(b);
    el.querySelector('.xy').textContent=x.toFixed(2)+', '+y.toFixed(2);
    el.querySelector('[data-bar=x]').style.width=(x*100)+'%';
    el.querySelector('[data-bar=y]').style.width=(y*100)+'%';
    drawXYGraph(el.querySelector('.xyg'), b);
    el.querySelector('[data-val=x]').textContent=TARGETS[b.tx].fmt?TARGETS[b.tx].fmt(x):'';
    el.querySelector('[data-val=y]').textContent=TARGETS[b.ty].fmt?TARGETS[b.ty].fmt(y):'';
  }
  $('hud-t').textContent=simTime.toFixed(1);
  const {K,U}=energy();
  $('hud-e').textContent='kinetic '+K.toFixed(3)+'  potential '+U.toFixed(3)+'  total '+(K+U).toFixed(3);
}

load('sun');
</script>
</body>
</html>
