# INSTALLED 2026-11-10 (ADR-393, the human: "Install it", on the Fable audit's finding 2). Drafted 2026-10-10 under
# tools/nightly/ (B448, ADR-209 item 4), where it sat unrun for a month while four armor rows counted it as coverage.
# The name matters: tools/nightly/freshness.py asks GitHub for the workflow `nightly.yml`. This workflow only calls
# `./verify nightly`; the jobs it runs are the entries in tools/nightly/jobs.json, so a later package adds a job
# without editing this file. tools/nightly_check.py reads this file (its workflow rows).
#
# WHAT IT DOES. Once a night on main (and on demand) it runs `./verify nightly` on a
# Linux runner and on a macOS runner, and uploads each runner's receipt as an artifact.
# Receipts are CI artifacts, never commits (the repo is public). A manual run with
# `drill` ticked runs the planted-fault drill instead (tools/nightly/run.py --drill):
# the monthly proof that the nightly can go red. Its run title ends "(drill)" so the
# freshness reader never counts it as a night.
#
# HOUSE STYLE. Copied from ci.yml: actions pinned by commit SHA with a version
# comment, the same checkout options, a read-only token. tools/workflow_pin_check.py
# holds those rules, and tools/nightly_check.py runs it on this file.
#
# WHAT THE FIRST NIGHTS SETTLED (B671, B681). The drill passed on GitHub (run
# 42931019358). The schedule fires late: the 03:17 cron started runs at 10:54 to 11:02
# UTC on 2026-11-11 to 13. `brew install llvm` worked on the macOS runner and both
# sanitizer checks ran there every night so far, none skipped. The Linux job was
# cancelled at 120 minutes on 11-11 (the dearest soak pair; the soak cells rotate over
# three nights, tools/h2_soak_check.mjs RUN TIME) and took 96 on 11-12, so its limit
# became 180 (ADR-397); 11-13 then took 146.5. macOS takes 6 to 7. STILL UNMEASURED:
# the runners' memory. The macOS jobs print SKIPPED, recorded as skipped and never as
# ran, when they cannot measure.
name: nightly
run-name: "nightly${{ inputs.drill && ' (drill)' || '' }}"
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC; an off-the-hour minute, as scheduled load is heaviest on the hour
  workflow_dispatch:
    inputs:
      drill:
        description: 'Run the planted-fault drill (must go red on each plant) instead of the jobs'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    # 180 since 2026-11-13 (ADR-397, B679): 120 cancelled the night of 11-11, and the green 11-12 night took 96
    # (the h2 fuzz alone 56). The first night under 180, 11-13, took 146.5 (fuzz 65); the dearest pair projects to
    # about 123 to 148 (B682). A backstop, not a budget: run.py sets no clock and the job floors are unchanged.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: nightly
        if: ${{ !inputs.drill }}
        run: ./verify nightly --receipt "$RUNNER_TEMP/nightly-receipt-linux.json"
      - name: nightly drill
        if: ${{ inputs.drill }}
        run: ./verify nightly --drill --receipt "$RUNNER_TEMP/nightly-receipt-linux.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: nightly-receipt-linux
          path: ${{ runner.temp }}/nightly-receipt-linux.json
          if-no-files-found: warn
          retention-days: 30

  macos:
    # macOS is the 10x runner (see ci.yml). Whether this repo's macOS minutes are billed
    # is UNCHECKED: ci.yml records the account using up its free minutes on 2026-07-19,
    # and no one has read the account's usage page since the nightly began.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      # The compiler for the sanitizer checks (ADR-199). tools/rtsan_check.py and
      # tools/tsan_stress_check.py find it through `brew --prefix llvm`; it installed
      # and ran on GitHub's runner on every night from 2026-11-11 to 13 (B671, B681). If
      # this step or the sanitizers ever fail to start, the checks print SKIPPED and
      # the receipt says skipped, not ran.
      - name: Homebrew LLVM
        if: ${{ !inputs.drill }}
        run: brew install llvm
      - name: nightly
        if: ${{ !inputs.drill }}
        run: ./verify nightly --receipt "$RUNNER_TEMP/nightly-receipt-macos.json"
      - name: nightly drill
        if: ${{ inputs.drill }}
        run: ./verify nightly --drill --receipt "$RUNNER_TEMP/nightly-receipt-macos.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: nightly-receipt-macos
          path: ${{ runner.temp }}/nightly-receipt-macos.json
          if-no-files-found: warn
          retention-days: 30
