# CI mirrors the local Stop-hook gate — but FRUGALLY (2026-07-19, after the
# account hit its free Actions minutes). Cost model that drained it: macOS
# runners bill 10x, and we were running the full matrix on BOTH push and
# pull_request (2x) for EVERY change including docs-only PRs. This config:
#   - skips CI entirely on docs-only changes (paths-ignore);
#   - runs once per change (PRs on pull_request; push CI is main-only, the
#     post-merge net — so a branch push doesn't double-run alongside its PR);
#   - cancels superseded runs (concurrency);
#   - keeps the CHEAP + can't-do-locally coverage on every PR (Linux verify-fast
#     + the Linux sanitizer runs + the Windows build/validate, which this dev
#     Mac cannot produce);
#   - defers the 10x macOS jobs to post-merge on main only — PR-time macOS is
#     redundant with the maintainer's local build + pluginval-10 + auval + install.
# pluginval stays strictness 10 (the strong bar). Windows uses --skip-gui-tests:
# its WebView2 GUI runtime is an explicitly-deferred residual (see CLAUDE.md
# §Domain), so gating CI on a headless editor test there would validate an
# environment we don't ship — the DSP/param/state/fuzz bar still runs at 10.
#
# RELEASES (B101, 2026-09-10; hardened B446 Wave 2, 2026-10-07): a `v*` tag runs
# the same push jobs and then `release` drafts a GitHub release. Tagging is a
# HUMAN act; CI never tags. The draft is published by the human's click.
#
# BUILD -> VALIDATE -> PACKAGE, three jobs per platform (B446 Wave 2):
#   build-*     compiles, stages the three bundles, tars them into $RUNNER_TEMP,
#               uploads the tar and publishes its SHA-256 as a job output.
#   validate-*  downloads the tar and runs pluginval, whose download is pinned by
#               SHA-256 (PLUGINVAL_* below; a mismatch fails the job). It is the
#               ONLY job that runs a third-party tool.
#   package-* / sign-macos  need BOTH jobs above, check the tar against the build
#               job's published hash (a job output no later job can rewrite), and
#               package into $RUNNER_TEMP — never into the source tree. They run
#               no third-party tool. On macOS, tools/package_macos.sh signs every
#               bundle BEFORE zipping (and, with credentials, notarizes and staples
#               both the bundles and the pkg). sign-macos is the tag-only twin of
#               package-macos and the only job bound to the `release` environment,
#               which is where the Apple secrets live; with no secrets it ships
#               ad-hoc and says so.
#   release     checks the tag's commit is on main, attaches an EXPLICIT file list
#               plus SHA256SUMS and a CycloneDX SBOM (tools/gen_sbom.py).
# Every action is pinned by commit SHA; the token is read-only except in `release`.
# tools/workflow_pin_check.py and tools/release_path_check.py hold these rules in
# `./verify fast`.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'traces/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'traces/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Trust-on-first-use pins, re-verified 2026-10-07 against the v1.0.4 release
  # assets. Bumping pluginval = change all three lines together.
  PLUGINVAL_URL_BASE: https://github.com/Tracktion/pluginval/releases/download/v1.0.4
  PLUGINVAL_MACOS_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  PLUGINVAL_WINDOWS_SHA256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab

jobs:
  verify-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: verify fast
        run: ./verify fast

  # ASan+UBSan and TSan over every compiled oracle ./verify runs, parsed from
  # ./verify itself (tools/sanitize_oracles.sh) so the list cannot drift.
  # Linux is the 1x runner, so this rides on every PR. The oracles are
  # single-threaded by construction, so TSan's verdict covers the DSP and the
  # shell's event path only — the GUI<->audio parameter queue is not exercised.
  sanitize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['address,undefined', 'thread']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: oracles under -fsanitize=${{ matrix.sanitizer }}
        run: tools/sanitize_oracles.sh "${{ matrix.sanitizer }}" build-sanitize

  build-windows:
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.stage.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: configure
        run: cmake -S . -B build
      - name: build
        run: cmake --build build --config Release -j3
      - name: stage bundles
        id: stage
        shell: pwsh
        run: |
          # Shortest match first: the bundle folder when clap-wrapper builds one,
          # the single-file .vst3 otherwise (the current layout).
          $vst3 = Get-ChildItem -Recurse -Filter horde.vst3 build | Sort-Object { $_.FullName.Length } | Select-Object -First 1
          if (-not $vst3) { throw "horde.vst3 not found under build/ — the bundle name is OUTPUT_NAME in CMakeLists.txt" }
          $clap = Get-ChildItem -Recurse -File -Filter horde.clap build | Select-Object -First 1
          if (-not $clap) { throw "horde.clap not found under build/" }
          $stage = Join-Path $env:RUNNER_TEMP stage
          New-Item -ItemType Directory -Force (Join-Path $stage VST3), (Join-Path $stage CLAP) | Out-Null
          Copy-Item -Recurse $vst3.FullName (Join-Path $stage VST3)
          Copy-Item $clap.FullName (Join-Path $stage CLAP)
          $tar = Join-Path $env:RUNNER_TEMP horde-windows-build.tar
          # Windows' own bsdtar, by full path: a GNU tar earlier on PATH reads the
          # drive letter in D:\... as a remote host.
          & "$env:SystemRoot\System32\tar.exe" -cf $tar -C $stage VST3 CLAP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $h = (Get-FileHash -Algorithm SHA256 $tar).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: horde-windows-build
          path: ${{ runner.temp }}/horde-windows-build.tar
          if-no-files-found: error

  validate-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: horde-windows-build
          path: ${{ runner.temp }}/in
      - name: pluginval (VST3, strictness 10, GUI-skipped — WebView2 runtime deferred)
        shell: pwsh
        env:
          BUILD_SHA256: ${{ needs.build-windows.outputs.sha256 }}
        run: |
          $tar = Join-Path $env:RUNNER_TEMP in/horde-windows-build.tar
          if ((Get-FileHash -Algorithm SHA256 $tar).Hash.ToLower() -ne $env:BUILD_SHA256) { throw "build tar does not match the build job's hash" }
          $b = Join-Path $env:RUNNER_TEMP bundles
          New-Item -ItemType Directory -Force $b | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $tar -C $b
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Join-Path $env:RUNNER_TEMP pluginval.zip
          Invoke-WebRequest -Uri "$env:PLUGINVAL_URL_BASE/pluginval_Windows.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($got -ne $env:PLUGINVAL_WINDOWS_SHA256) { throw "pluginval_Windows.zip SHA-256 mismatch: got $got" }
          $pv = Join-Path $env:RUNNER_TEMP pv
          Expand-Archive $zip -DestinationPath $pv
          & (Join-Path $pv pluginval.exe) --strictness-level 10 --skip-gui-tests --validate (Join-Path $b VST3/horde.vst3)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package-windows:
    needs: [build-windows, validate-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: horde-windows-build
          path: ${{ runner.temp }}/in
      - name: package (zip)
        env:
          BUILD_SHA256: ${{ needs.build-windows.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$BUILD_SHA256  $RUNNER_TEMP/in/horde-windows-build.tar" | sha256sum -c -
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA:0:7}"; fi
          mkdir -p "$RUNNER_TEMP/stage" "$RUNNER_TEMP/dist"
          tar -xf "$RUNNER_TEMP/in/horde-windows-build.tar" -C "$RUNNER_TEMP/stage"
          (cd "$RUNNER_TEMP/stage" && zip -qrX "$RUNNER_TEMP/dist/horde-windows-x64-$v.zip" VST3 CLAP)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: horde-windows
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  # macOS is the 10x runner: post-merge net only (push to main, and tags). PR-time
  # macOS is covered by the maintainer's local build + pluginval 10 + auval + install.
  build-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.stage.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: configure
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build "$GITHUB_WORKSPACE/build" -j3
      - name: bench (informational)
        run: ./build/renderer_bench || true
      - name: stage bundles
        id: stage
        run: |
          set -euo pipefail
          A=build/HYPERSAW_assets
          S="$RUNNER_TEMP/stage"
          mkdir -p "$S/VST3" "$S/Components" "$S/CLAP"
          for b in horde.vst3 horde.component horde.clap; do
            test -e "$A/$b" || { echo "missing $A/$b — OUTPUT_NAME in CMakeLists.txt is the bundle name" >&2; exit 1; }
          done
          cp -R "$A/horde.vst3" "$S/VST3/"
          cp -R "$A/horde.component" "$S/Components/"
          cp -R "$A/horde.clap" "$S/CLAP/"
          # tar, not upload-artifact's own zip: it keeps bundle permissions and links.
          tar -cf "$RUNNER_TEMP/horde-macos-build.tar" -C "$S" VST3 Components CLAP
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/horde-macos-build.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: horde-macos-build
          path: ${{ runner.temp }}/horde-macos-build.tar
          if-no-files-found: error

  validate-macos:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: horde-macos-build
          path: ${{ runner.temp }}/in
      - name: pluginval (VST3, strictness 10)
        env:
          BUILD_SHA256: ${{ needs.build-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$BUILD_SHA256  $RUNNER_TEMP/in/horde-macos-build.tar" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bundles" "$RUNNER_TEMP/pv"
          tar -xf "$RUNNER_TEMP/in/horde-macos-build.tar" -C "$RUNNER_TEMP/bundles"
          curl -sSfL -o "$RUNNER_TEMP/pluginval.zip" "$PLUGINVAL_URL_BASE/pluginval_macOS.zip"
          echo "$PLUGINVAL_MACOS_SHA256  $RUNNER_TEMP/pluginval.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pv"
          "$RUNNER_TEMP/pv/pluginval.app/Contents/MacOS/pluginval" --strictness-level 10 \
            --validate "$RUNNER_TEMP/bundles/VST3/horde.vst3"

  # main pushes: ad-hoc seal, zip, unsigned pkg. No secrets are referenced here.
  package-macos:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, validate-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: horde-macos-build
          path: ${{ runner.temp }}/in
      - name: sign, then package
        env:
          BUILD_SHA256: ${{ needs.build-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$BUILD_SHA256  $RUNNER_TEMP/in/horde-macos-build.tar" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/stage"
          tar -xf "$RUNNER_TEMP/in/horde-macos-build.tar" -C "$RUNNER_TEMP/stage"
          tools/package_macos.sh "$RUNNER_TEMP/stage" "$RUNNER_TEMP/dist" "0.0.0-${GITHUB_SHA:0:7}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: horde-macos
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  # v* tags: the same steps, bound to the `release` environment — the only place
  # the Apple secrets can be read. All five present: Developer ID sign, notarize,
  # staple. None present: ad-hoc, said plainly. Some: RED.
  sign-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, validate-macos]
    runs-on: macos-latest
    environment: release
    outputs:
      signing: ${{ steps.package.outputs.signing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: horde-macos-build
          path: ${{ runner.temp }}/in
      - name: sign, notarize, then package
        id: package
        env:
          BUILD_SHA256: ${{ needs.build-macos.outputs.sha256 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$BUILD_SHA256  $RUNNER_TEMP/in/horde-macos-build.tar" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/stage"
          tar -xf "$RUNNER_TEMP/in/horde-macos-build.tar" -C "$RUNNER_TEMP/stage"
          tools/package_macos.sh "$RUNNER_TEMP/stage" "$RUNNER_TEMP/dist" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: horde-macos
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  # A `v*` tag drafts the release with the artifacts above attached. DRAFT on
  # purpose: publishing is the human's click, after reading the CHANGELOG cut.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-fast, sanitize, package-windows, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag's commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main \
            || { echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to draft a release" >&2; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: horde-windows
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: horde-macos
          path: ${{ runner.temp }}/dist
      - name: draft release (explicit assets, checksums, SBOM)
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ needs.sign-macos.outputs.signing }}
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="$RUNNER_TEMP/dist"
          # The download holds exactly the three built files, nothing else.
          printf '%s\n' "horde-macos-universal-$V.pkg" "horde-macos-universal-$V.zip" "horde-windows-x64-$V.zip" > "$RUNNER_TEMP/want"
          ls -A "$D" | LC_ALL=C sort > "$RUNNER_TEMP/have"
          diff "$RUNNER_TEMP/want" "$RUNNER_TEMP/have" || { echo "release inputs differ from the expected three files" >&2; exit 1; }
          python3 tools/gen_sbom.py --version "$V" --out "$D/horde-$V.cdx.json"
          (cd "$D" && sha256sum "horde-macos-universal-$V.pkg" "horde-macos-universal-$V.zip" \
                       "horde-windows-x64-$V.zip" "horde-$V.cdx.json" > SHA256SUMS && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
             --title "horde $GITHUB_REF_NAME" \
             --notes "Draft cut by CI from tag $GITHUB_REF_NAME. Notes: CHANGELOG.md at this tag. macOS signing: $SIGNING. Verify downloads against SHA256SUMS; the SBOM lists every pinned dependency." \
             "$D/horde-macos-universal-$V.pkg" "$D/horde-macos-universal-$V.zip" "$D/horde-windows-x64-$V.zip" \
             "$D/horde-$V.cdx.json" "$D/SHA256SUMS"
