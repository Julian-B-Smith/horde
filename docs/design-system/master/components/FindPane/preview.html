<!-- @dsCard group="Morph" height=620 subtitle="Find in the morph field: search, show only where the corners differ or all, filter by kind, jump to a section, and the field's census" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Find pane</title></head>
<body>
<div class="hd-fit" style="padding:14px 16px 4px; gap:14px 18px">
  <div class="hd-col" style="gap:4px; flex:0 1 250px; min-width:0; align-items:stretch">
    <span class="hd-cluster">Find</span>
    <div id="find"></div>
  </div>
  <div class="hd-col" style="flex:1 1 420px; min-width:0; align-items:stretch">
    <div id="grid"></div>
  </div>
</div>
<p class="hd-hint" style="margin:4px 16px 12px">Type to search (a search shows every match, whatever the view) · WHERE CORNERS DIFFER hides rows whose four corners agree · the kind pills hide or show a kind · a section pill opens ALL at that section. SAMPLE data, generated in this preview; never the engine.</p>
<script>
(function () {
  var H = window.Horde;
  /* SAMPLE morph field: the lab's demo rows (B211), hand-set corners; never the engine */
  function field() {
    var ms = function (x) { return Math.round(10 + x * 990) + ' ms'; }, ct = function (x) { return Math.round(x * 50) + ' ct'; };
    return [
      { key: 'osc1.volume', name: 'Volume', section: 'OSC 1', group: 'Mix', vals: [.4, .45, .4, .3] },
      { key: 'osc1.pullK', name: 'Pull K', section: 'OSC 1', group: 'The coupling', vals: [.2, .7, .35, .9] },
      { key: 'osc1.topology', name: 'Topology', kind: 's', section: 'OSC 1', group: 'The coupling', labels: ['ring', 'all-to-all', 'chain', 'star'], vals: [0, 1, 1, 3] },
      { key: 'osc1.drift', name: 'Drift', section: 'OSC 1', group: 'Drift', vals: [.12, .12, .12, .12], fmt: ct, def: .12 },
      { key: 'osc2.power', name: 'Power', kind: 'g', section: 'OSC 2', group: 'Mix', vals: [0, 1, 0, 1] },
      { key: 'osc2.detune', name: 'Detune', section: 'OSC 2', group: 'Pitch', vals: [.1, .8, .1, .8], fmt: ct },
      { key: 'osc2.law', name: 'Detune law', kind: 's', section: 'OSC 2', group: 'Pitch', labels: ['linear', 'exponential', 'golden', 'cluster', 'spread'], vals: [0, 4, 0, 4] },
      { key: 'sub.on', name: 'Power', kind: 'g', section: 'SUB', group: 'Sub', vals: [0, 0, 1, 1] },
      { key: 'sub.wave', name: 'Wave', kind: 's', section: 'SUB', group: 'Sub', labels: ['sine', 'triangle', 'square', 'saw', 'pulse', 'noise', 'bump'], vals: [3, 3, 0, 6] },
      { key: 'sub.level', name: 'Level', section: 'SUB', group: 'Sub', vals: [.8, .8, .55, .9] },
      { key: 'fx1.type', name: 'Type', kind: 's', unit: 'FX1', section: 'FX RACK', group: 'Slot 1', labels: ['Off', 'Drive', 'Chorus', 'Echo'], vals: [0, 0, 1, 1] },
      { key: 'fx1.amount', name: 'Amount', unit: 'FX1', section: 'FX RACK', group: 'Slot 1', vals: [.5, .5, .3, .75] },
      { key: 'play.bendLaw', name: 'Bend law', kind: 's', section: 'PLAY', group: 'Bend', labels: ['constant time', 'constant rate', 'lag', 'mass-spring'], vals: [0, 1, 0, 3] },
      { key: 'play.bendTime', name: 'Bend time', section: 'PLAY', group: 'Bend', vals: [.11, .24, .11, .29], fmt: ms },
      { key: 'play.glide', name: 'Glide', section: 'PLAY', group: 'Bend', vals: [.05, .05, .05, .05], fmt: ms, def: .05 }
    ];
  }
  var CORNER_NAMES = ['MISC - Cloud', 'MISC - Lock', 'MISC - Splay', 'MISC - Two Cluster'];
  var S = new H.Session({ x: .62, y: .37, corners: CORNER_NAMES });
  var rows = field(), rng = H.Synth.rng(1092), names = ['Spread', 'Width', 'Tilt', 'Gauss', 'Scatter', 'Onset', 'Air', 'Pan motion'];
  names.forEach(function (n, i) { var base = Math.round(rng() * 100) / 100, same = rng() < .35;
    rows.push({ key: 'swarm.' + i, name: n, section: 'SWARM', group: i < 4 ? 'The swarm' : 'Onset & scatter', vals: [0, 1, 2, 3].map(function () { return same ? base : Math.round(rng() * 100) / 100; }) }); });
  var g = H.MorphGrid(document.getElementById('grid'), S, { rows: rows, maxHeight: 440 });
  H.FindPane(document.getElementById('find'), S, g);
  S.start(); window.__S = S;
})();
</script>
</body>
</html>
