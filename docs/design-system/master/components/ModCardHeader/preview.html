<!-- @dsCard group="Modulators" height=222 subtitle="The header every modulator card shares: kind colour, name and number, scope, and the retrigger switch" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Mod card header</title></head>
<body>
<div class="hd-fit" style="padding:14px 16px 4px; gap:12px 16px" id="host">
  <section class="hd-modcard" style="flex:1 1 300px; max-width:440px" aria-label="LFO 1"><div id="h1"></div><span class="hd-hint" id="d1"></span></section>
  <section class="hd-modcard" style="flex:1 1 300px; max-width:440px" aria-label="ENV 2"><div id="h2"></div><span class="hd-hint" id="d2"></span></section>
  <section class="hd-modcard" style="flex:1 1 300px; max-width:440px" aria-label="ORBITAL 1"><div id="h3"></div><span class="hd-hint" id="d3"></span></section>
  <section class="hd-modcard" style="flex:1 1 300px; max-width:440px" aria-label="MIDI"><div id="h4"></div><span class="hd-hint">The trackers are the trigger's own source: their card carries the EVERY / FIRST mode, not a retrigger.</span></section>
</div>
<p class="hd-hint" style="margin:6px 16px 12px">Kind colour marks the kind only; two of one kind differ by name and number. SAMPLE data, generated in this preview; never the engine.</p>
<script>
(function () {
  var H = window.Horde;
  function say(id, on, what) { document.getElementById(id).textContent = 'Retrigger ' + (on ? 'ON: ' : 'OFF: ') + what[on ? 1 : 0]; }
  var L = ['the LFO runs free across notes.', 'each note-on starts a new cycle at φ.'], E = ['a note-on while the gate is high continues (legato).', 'each note-on restarts from the level it has reached.'],
      O = ['the field keeps moving across notes.', 'each note-on resets the field to its initial conditions.'];
  H.ModCardHeader(document.getElementById('h1'), { name: 'LFO 1', kind: 'lfo', scope: 'GLOBAL', retrig: false, onRetrig: function (v) { say('d1', v, L); } }); say('d1', false, L);
  H.ModCardHeader(document.getElementById('h2'), { name: 'ENV 2', kind: 'env', scope: 'PER VOICE', retrig: true, onRetrig: function (v) { say('d2', v, E); } }); say('d2', true, E);
  H.ModCardHeader(document.getElementById('h3'), { name: 'ORBITAL 1', kind: 'lfo', kindLabel: 'MOD', scope: 'GLOBAL', retrig: false, onRetrig: function (v) { say('d3', v, O); } }); say('d3', false, O);
  H.ModCardHeader(document.getElementById('h4'), { name: 'MIDI', kind: 'engine', kindLabel: 'TRACKERS', scope: 'GLOBAL', retrig: null });
})();
</script>
</body>
</html>
