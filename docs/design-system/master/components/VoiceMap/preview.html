<!-- @dsCard group="Visualizers" height=310 subtitle="Each member’s pan and detune: the target ring, the actual dot, the root star; voice-bound" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Voice map</title></head>
<body>
<div class="hd-fit" style="padding:14px 16px 4px; gap:12px 24px" id="host">
  <div class="hd-col" style="gap:6px; flex:1 1 260px; max-width:400px">
    <div class="hd-viz" style="aspect-ratio:1.6 / 1"><canvas id="cv" role="img" aria-label="Voice map: pan across, detune in cents up and down"></canvas></div>
    <div class="hd-row" style="justify-content:space-between; width:100%"><div id="scr"></div><span class="hd-value" id="read" aria-live="off"></span></div>
  </div>
  <div class="hd-col" style="gap:6px; flex:1 1 220px">
    <div class="hd-row"><span class="hd-cluster">Voice map</span><span class="vtag">VOICE-BOUND</span></div>
    <span class="hd-label" style="line-height:1.5">Pan across, detune in cents up and down (±24 rails dashed). A hollow ring is where a member is placed, the filled dot where it is now; the gap between them is drift, glide and pull. The root member wears the star.</span>
    <div class="hd-row"><span class="hd-label" style="width:64px">Drift</span><div class="hd-pills" role="radiogroup" aria-label="Drift" id="k"><button class="hd-pill hd-focus" role="radio" aria-checked="false" data-v="0">none</button><button class="hd-pill hd-focus" role="radio" aria-checked="true" data-v="1">some</button><button class="hd-pill hd-focus" role="radio" aria-checked="false" data-v="2.5">wide</button></div></div>
    <span class="hd-hint">SAMPLE data, generated in this preview; never the engine.</span>
  </div>
</div>
<script>
(function () {
  var H = window.Horde, cv = document.getElementById('cv'), read = document.getElementById('read'), T = 2 * Math.PI;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function pick(id, fn) { var g = document.getElementById(id); g.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return;
    g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-checked', String(x === b)); }); fn(b.dataset.v); }); }
  var rnd = H.Synth.rng(31), n = 7, D = 1, t = 0, m = [];
  for (var i = 0; i < n; i++) m.push({ tp: -.8 + 1.6 * i / (n - 1), tc: [-20, -11, -4, 0, 4, 11, 20][i], p: 0, c: 0, ph: rnd() * 10, root: i === 3 });
  pick('k', function (v) { D = +v; });
  function step(dt) { t += dt; m.forEach(function (q) { q.p = q.tp + D * .06 * Math.sin(t * .7 + q.ph); q.c = q.tc + D * 4 * Math.sin(t * .9 + q.ph * 1.7); }); }
  function frame() { H.Viz.voiceMap(cv, m); read.textContent = 'spread ' + (D * 4).toFixed(0) + ' ct'; }
  H.ScreenScheme(document.getElementById('scr'), document.getElementById('host'), { onchange: function () { if (reduce) setTimeout(function () { frame(0); }, 0); } });
  for (var k = 0; k < 90; k++) step(1 / 30, k * 33);
  if (reduce) { frame(0); return; }
  var last = null;
  (function loop(now) { var dt = last === null ? 1 / 30 : Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; step(dt, now); frame(now); requestAnimationFrame(loop); })(performance.now());
})();
</script>
</body>
</html>
