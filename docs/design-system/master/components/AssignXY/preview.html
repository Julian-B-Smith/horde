<!-- @dsCard group="Controls" height=240 subtitle="GUI-9: two extra macro knobs on one pad, with a chip per axis and a mark at rest." -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AssignXY</title></head>
<body>
<div style="padding:14px 16px 10px"><div id="xy" style="width:236px; height:170px"></div></div>
<script>
(function () {
  var H = window.Horde, S = new H.Session({ x: .5, y: .5, corners: ['A', 'B', 'C', 'D'] });
  H.AssignXY(document.getElementById('xy'), S, { x: .62, y: .58, tag: 'SAMPLE', rest: true, axes: [{ id: 'y', label: 'Y', corner: 'tl', text: function () { return 'touches 2'; } }, { id: 'x', label: 'X', corner: 'br', text: function () { return 'nothing here'; } }] }); S.start();
})();
</script>
</body>
</html>
