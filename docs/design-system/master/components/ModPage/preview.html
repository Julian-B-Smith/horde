<!-- @dsCard group="Modulators" height=640 subtitle="M5 (ADR-338 r8): the Mod page as a list and a detail: every modulator a thin row grouped by kind with a + per kind, the selected one at the full tier; the matrix grid is the page's route view" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ModPage</title></head>
<body>
<div style="padding:14px 16px 10px">
  <div id="page" style="max-width:958px; height:545px; box-sizing:border-box; background:var(--bg); border:var(--stroke-ink) solid var(--ink); padding:6px"></div>
  <p class="hd-msg" id="msg" style="margin:6px 0 0"></p>
  <p class="hd-hint" style="margin:2px 0 0">Pick a row: the detail fills the page (its picture, the bundle's editor, its controls, the routes it drives; x on a route removes it). Detail | Routes switches the right side to ADR-266's matrix grid on the same routes. + per kind asks the host to add one. Values are SAMPLES.</p>
</div>
<script>
(function () {
  var H = window.Horde, T2 = Math.PI * 2;
  function m32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var pctf = function (x) { return Math.round(x * 100) + '%'; };
  var msf = function (x) { var v = 4 * Math.pow(500, x); return v < 1000 ? Math.round(v) + ' ms' : (v / 1000).toFixed(2) + ' s'; };
  /* a parameter's props: SAMPLE values (the engine reports the real ones in GUI 3) */
  function P(key, name, abbr, vals, extra) { var p = { key: key, name: name, abbr: abbr, path: key.split('.')[0].toUpperCase() + ' · ' + name, vals: vals, fmt: pctf, def: vals[0] }; for (var k in extra || {}) p[k] = extra[k]; return p; }
  /* SAMPLE sources: deterministic functions of time, labelled stand-ins for what the engine publishes */
  var SOURCES = [
    { id: 'env2', name: 'ENV 2', kind: 'env', f: function (t) { var p = t % 1.7; return p < .04 ? p / .04 : Math.exp(-(p - .04) * 3.2); } },
    { id: 'lfo1', name: 'LFO 1', kind: 'lfo', f: function (t) { return .5 + .5 * Math.sin(t * T2 * .45); } },
    { id: 'lfo2', name: 'LFO 2', kind: 'lfo', f: function (t) { return .5 + .5 * Math.sin(t * T2 * .8 + 1); } },
    { id: 'sh1', name: 'S&H 1', kind: 'lfo', f: function (t) { return m32(Math.floor(t * 2.2) * 7919 + 13)(); } },
    { id: 'macro1', name: 'MACRO 1', kind: 'macro', f: function (t) { return .5 + .32 * Math.sin(t * T2 * .05); } },
    { id: 'velocity', name: 'Velocity', kind: 'engine', f: function (t) { var p = t % 1.7; return .62 * (p < .04 ? p / .04 : Math.exp(-(p - .04) * 1.2)); } },
    { id: 'osc1R', name: 'Osc 1 R', kind: 'engine', f: function (t) { return .55 + .3 * Math.sin(t * 1.3) * Math.sin(t * .37 + 1); } }
  ];
  /* a stand-in envelope drawing (a modulator brings its own picture with m.paint) */
  function envPaint(K, t, opt) {
    var g = K.g, W = K.W, Hh = K.H, k = K.k, C = K.col, pad = 2 * k, a = .12, d = .35, s = .5, r = .4, sus = .3, Tt = a + d + sus + r;
    function y(x) { var q = x * Tt; if (q < a) return q / a; q -= a; if (q < d) return 1 - (1 - s) * q / d; q -= d; if (q < sus) return s; q -= sus; return s * (1 - q / r); }
    var Y = function (v) { return Hh - pad - (Hh - 2 * pad) * v; }, X = function (x) { return pad + (W - 2 * pad) * x; }, i;
    g.beginPath(); for (i = 0; i <= 64; i++) { if (i) g.lineTo(X(i / 64), Y(y(i / 64))); else g.moveTo(X(0), Y(y(0))); }
    g.save(); g.lineTo(X(1), Y(0)); g.lineTo(X(0), Y(0)); g.closePath(); g.fillStyle = C(K.P.value, .2); g.fill(); g.restore();
    g.beginPath(); for (i = 0; i <= 64; i++) { if (i) g.lineTo(X(i / 64), Y(y(i / 64))); else g.moveTo(X(0), Y(y(0))); }
    g.strokeStyle = C(K.P.value); g.lineWidth = 1.5 * k; g.stroke();
    var ph = (t % 2.4) / 2.4; g.fillStyle = C(K.P.meter); g.beginPath(); g.arc(X(ph), Y(y(ph)), (opt.big ? 3.2 : 2.2) * k, 0, 2 * Math.PI); g.fill();
  }
  var SUBS = [{ k: 'env2.attack', n: 'Attack', a: 'ATK', v: [.18, .22, .12, .3], f: msf }, { k: 'env2.hold', n: 'Hold', a: 'HLD', v: [.1, .1, .15, .1], f: msf }, { k: 'env2.decay', n: 'Decay', a: 'DEC', v: [.42, .5, .3, .6], f: msf },
    { k: 'env2.sustain', n: 'Sustain', a: 'SUS', v: [.55, .7, .4, .62] }, { k: 'env2.release', n: 'Release', a: 'REL', v: [.5, .4, .6, .45], f: msf },
    { k: 'env2.attackCurve', n: 'Attack curve', a: 'AC', v: [.5, .6, .4, .5], bip: 1 }, { k: 'env2.decayCurve', n: 'Decay curve', a: 'DC', v: [.62, .7, .5, .6], bip: 1 }, { k: 'env2.releaseCurve', n: 'Release curve', a: 'RC', v: [.6, .5, .66, .6], bip: 1 },
    { k: 'env2.velocity', n: 'Velocity', a: 'VEL', v: [.4, .5, .3, .7] }];
  var ENVP = {}; SUBS.forEach(function (s) { ENVP[s.k.slice(5)] = P(s.k, s.n, s.a, s.v, { fmt: s.f || pctf, bipolar: !!s.bip }); });
  function session(extra) {
    var o = { x: .42, y: .36, corners: ['Glass horde pad', 'Undertone cathedral', 'Smear and strike', 'Crushed bells'], sources: SOURCES, mappings: [
      { param: 'env2.decay', src: 'lfo1', pol: 'bi', depth: .16 }, { param: 'env2.sustain', src: 'velocity', pol: 'uni', depth: .22 }, { param: 'env2.release', src: 'lfo2', pol: 'uni', depth: .3 },
      { param: 'env2.attack', src: 'sh1', pol: 'bi', depth: .12 }, { param: 'env2.velocity', src: 'macro1', pol: 'uni', depth: .3 }] };
    for (var k in extra || {}) o[k] = extra[k];
    return new H.Session(o);
  }
  function toggle(host, label, on, onChange) {
    var w = document.createElement('label'); w.className = 'hd-row hd-label'; w.style.cssText = 'display:inline-flex;align-items:center;gap:4px';
    var b = document.createElement('button'); b.className = 'hd-toggle hd-sm hd-focus'; b.type = 'button'; b.setAttribute('role', 'switch'); b.setAttribute('aria-label', label); b.setAttribute('aria-checked', String(!!on));
    b.addEventListener('click', function () { var v = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', String(v)); if (onChange) onChange(v); });
    w.appendChild(document.createTextNode(label)); w.appendChild(b); host.appendChild(w); return b;
  }

  /* SAMPLE modulators: one descriptor per Source in the Session (same id). `ctls` are the compact card's few controls (tiny knobs). */
  var kn = function (key, name, abbr, vals, extra) { return { knob: P(key, name, abbr, vals, extra) }; };
  var MODS = [
    { id: 'env2', name: 'ENV 2', kind: 'env', kindLabel: 'ENV', group: 'env', fixed: true, paint: envPaint, ctls: ['attack', 'decay', 'sustain', 'release'].map(function (n) { return { knob: ENVP[n] }; }) },
    { id: 'lfo1', name: 'LFO 1', kind: 'lfo', kindLabel: 'LFO', group: 'lfo', ctls: [kn('lfo1.rate', 'Rate', 'RATE', [.62, .62, .62, .62]), kn('lfo1.shape', 'Shape', 'SHP', [0, 0, 0, 0]), kn('lfo1.phase', 'Phase', 'PHS', [0, 0, 0, 0]), kn('lfo1.depth', 'Depth', 'DPTH', [1, 1, 1, 1])] },
    { id: 'lfo2', name: 'LFO 2', kind: 'lfo', kindLabel: 'LFO', group: 'lfo', ctls: [kn('lfo2.rate', 'Rate', 'RATE', [.78, .78, .78, .78]), kn('lfo2.shape', 'Shape', 'SHP', [.34, .34, .34, .34]), kn('lfo2.phase', 'Phase', 'PHS', [.25, .25, .25, .25]), kn('lfo2.depth', 'Depth', 'DPTH', [1, 1, 1, 1])] },
    { id: 'sh1', name: 'S&H 1', kind: 'lfo', kindLabel: 'S&H', group: 'sh', ctls: [kn('sh1.rate', 'Rate', 'RATE', [.55, .55, .55, .55]), kn('sh1.smooth', 'Smooth', 'SMTH', [.15, .15, .15, .15])] },
    { id: 'macro1', name: 'MACRO 1', kind: 'macro', kindLabel: 'MACRO', group: 'macro', picture: 'arc', ctls: [kn('macro1.value', 'Macro 1', 'VAL', [.62, .62, .62, .62])] },
    { id: 'velocity', name: 'Velocity', kind: 'engine', kindLabel: 'MIDI', group: 'midi', fixed: true, note: 'a MIDI source: nothing to set' },
    { id: 'osc1R', name: 'Osc 1 R', kind: 'engine', kindLabel: 'ENGINE', group: 'eng', fixed: true, note: 'published by the engine: nothing to set' }
  ];

  var S = session(); S.mappings.length = 0;
  var seed = [['osc1.detune', 'lfo1', 'bi', .16], ['osc1.detune', 'velocity', 'uni', .12], ['b1.cut', 'env2', 'uni', .34], ['b1.depth', 'env2', 'uni', .2], ['osc1.pan', 'sh1', 'bi', .3], ['osc1.width', 'lfo2', 'uni', .28], ['osc1.coupling', 'osc1R', 'bi', .2], ['osc1.level', 'macro1', 'uni', .4]];
  var PN = { 'osc1.detune': 'Detune', 'b1.cut': 'Cut rate', 'b1.depth': 'Depth', 'osc1.pan': 'Pan', 'osc1.width': 'Width', 'osc1.coupling': 'Coupling', 'osc1.level': 'Level' };
  Object.keys(PN).forEach(function (k) { S.params[k] = { key: k, name: PN[k], path: (k.split('.')[0] === 'b1' ? 'Osc 1 · Blade 1' : 'Osc 1') + ' · ' + PN[k], vals: [.5, .5, .5, .5], fmt: pctf, def: .5 }; });
  seed.forEach(function (a) { S.mappings.push({ param: a[0], src: a[1], pol: a[2], depth: a[3] }); });
  var more = [{ id: 'lfo3', name: 'LFO 3', kind: 'lfo', kindLabel: 'LFO', group: 'lfo', ctls: [kn('lfo3.rate', 'Rate', 'RATE', [.4, .4, .4, .4])] }];
  S.sources.push({ id: 'lfo3', name: 'LFO 3', kind: 'lfo', f: function (t) { return .5 + .5 * Math.sin(t * 2.1); } });
  var ALL = MODS.concat(more); MODS.forEach(function (m) { m.active = true; });
  var kinds = [{ id: 'env', label: 'ENV' }, { id: 'lfo', label: 'LFO' }, { id: 'sh', label: 'S&H' }, { id: 'macro', label: 'MACRO' }, { id: 'midi', label: 'MIDI' }, { id: 'eng', label: 'ENGINE' }];
  var pg = H.ModPage(document.getElementById('page'), S, { kinds: kinds, select: 'env2', mods: function () { return ALL.filter(function (m) { return m.active !== false; }); },
    onAdd: function (k) { var m = ALL.filter(function (q) { return q.group === k && q.active === false; })[0]; if (m) { m.active = true; m.pending = true; S.say('+ ' + m.name + ': pending until mapped'); } else S.say('No more ' + k + ' in the sample'); },
    onRemove: function (m, rs) { S.say('Remove ' + m.name + ' and ' + rs.length + ' route(s)? The host does it as one undo step.'); },
    editor: function (m, host) {
      if (m.id === 'env2') { var ed = H.EnvelopeEditor(host, { name: m.name, adsr: { a: .12, d: .35, s: .5, r: .4 }, aspect: '5 / 1' }); S.add({ render: function () { if (host.getClientRects().length) ed.draw(); } }); }
      else if (m.kind === 'lfo' && m.group === 'lfo') { var le = H.LfoShapeEditor(host, { name: m.name, aspect: '5 / 1', position: function () { return (S.t * .6) % 1; } }); S.add({ render: function () { if (host.getClientRects().length) le.draw(); } }); }
    },
    matrix: { dests: Object.keys(PN).map(function (k) { return { key: k, name: S.params[k].path, short: PN[k].slice(0, 4).toUpperCase() }; }) } });
  var msg = document.getElementById('msg'); S.on(function () { msg.textContent = S.message; });
  S.start();
})();
</script>
</body>
</html>
