<!-- @dsCard group="Visualizers" height=740 subtitle="Horizontal and vertical: a row (or column) per member, its phase dot moving along it; voice-bound" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Phase carpet</title></head>
<body>
<div class="hd-col" style="padding:14px 16px 4px; gap:8px" id="host">
  <div class="hd-row" style="gap:8px"><span class="hd-cluster">Phase carpet</span><span class="vtag">VOICE-BOUND</span><div id="scr"></div></div>
  <div class="hd-row"><span class="hd-label" style="width:64px">Coupling</span><div class="hd-pills" role="radiogroup" aria-label="Coupling" id="k">
    <button class="hd-pill hd-focus" role="radio" aria-checked="true" data-v="auto">auto</button><button class="hd-pill hd-focus" role="radio" aria-checked="false" data-v="0.2">loose</button><button class="hd-pill hd-focus" role="radio" aria-checked="false" data-v="3">locked</button></div></div>
  <div class="hd-row"><span class="hd-label" style="width:64px">Show</span><div class="hd-pills" role="radiogroup" aria-label="Orientation" id="o">
    <button class="hd-pill hd-focus" role="radio" aria-checked="true" data-v="both">both</button><button class="hd-pill hd-focus" role="radio" aria-checked="false" data-v="h">horizontal</button><button class="hd-pill hd-focus" role="radio" aria-checked="false" data-v="v">vertical</button></div></div>
  <div class="hd-fit" style="gap:12px; width:100%">
    <figure class="hd-col" style="margin:0; gap:4px; flex:1 1 260px; max-width:360px" id="fh">
      <div class="hd-viz" style="aspect-ratio:1.6 / 1"><canvas id="h" role="img" aria-label="Phase carpet, horizontal: each row is one member; its dot moves left and right with its phase"></canvas></div>
      <figcaption class="hd-hint">HORIZONTAL: each row is one voice member; its dot's position along the row is its phase.</figcaption></figure>
    <figure class="hd-col" style="margin:0; gap:4px; flex:1 1 100%; max-width:100%" id="fv">
      <div class="hd-viz" style="aspect-ratio:3.2 / 1"><canvas id="v" role="img" aria-label="Phase carpet, vertical: each column is one member; its dot moves up and down with its phase"></canvas></div>
      <figcaption class="hd-hint">VERTICAL: each column is one voice member; its dot's position along the column is its phase.</figcaption></figure>
  </div>
  <span class="hd-hint">One SAMPLE swarm (8 members, seeded) drives both, generated in this preview; a member inside a blade lights in value. Locking reads as the dots lining up.</span>
</div>
<script>
(function () {
  var H = window.Horde, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sw = H.Synth.swarm(23, 8), t = 0, K = null, hist = [];
  document.getElementById('k').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-checked', String(x === b)); }); K = b.dataset.v === 'auto' ? null : +b.dataset.v; });
  function inBlade(p) { return p > .25 && p < .45; }
  function step(dt) { t += dt; sw.step(dt, K === null ? 1.1 + 1.3 * Math.sin(t * .25) : K); hist.push(sw.phase.slice()); if (hist.length > 16) hist.shift(); }
  function frame() { H.Viz.carpet(document.getElementById('h'), hist, inBlade); H.Viz.carpetV(document.getElementById('v'), hist, inBlade); }
  document.getElementById('o').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-checked', String(x === b)); });
    document.getElementById('fh').hidden = b.dataset.v === 'v'; document.getElementById('fv').hidden = b.dataset.v === 'h'; frame(); });
  H.ScreenScheme(document.getElementById('scr'), document.getElementById('host'), { onchange: function () { if (reduce) setTimeout(frame, 0); } });
  for (var k = 0; k < 90; k++) step(1 / 30);
  if (reduce) { frame(); return; }
  var last = null;
  (function loop(now) { var dt = last === null ? 1 / 30 : Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; step(dt); frame(); requestAnimationFrame(loop); })(performance.now());
})();
</script>
</body>
</html>
