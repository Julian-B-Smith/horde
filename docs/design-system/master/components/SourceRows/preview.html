<!-- @dsCard group="Modulation" height=420 subtitle="MS4: the bank's row form: a thin row per source (swatch, name and route count, live meter, value, Map). While MAP is on a click on a row makes it the source" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Source rows</title></head>
<body>
<div style="padding:14px 16px 10px">
  <div id="win" style="background:var(--panel); border:var(--stroke-ink) solid var(--ink); border-radius:var(--radius-window)">
    <div class="hd-row" style="justify-content:space-between; gap:8px; padding:8px 10px; border-bottom:1px dashed var(--div)">
      <span class="hd-cluster">MS4 · the bank rows</span>
      <div class="hd-row" style="gap:10px"><div id="map"></div></div>
    </div>
    <div class="hd-fit" style="gap:14px; padding:10px">
      <div id="rows" style="flex:0 1 330px; min-width:0"></div>
      <div style="display:flex; flex-wrap:wrap; gap:4px; flex:1 1 200px; min-width:0; align-content:flex-start" id="knobs"></div>
    </div>
  </div>
  <p class="hd-msg" id="msg" style="margin:6px 0 0"></p>
  <p class="hd-hint" style="margin:2px 0 0">Turn MAP on, then click a row's body: it lights and the next mapping uses that source. The Map button turns MAP on with that row's source (again: off). Click a knob to map. The pictures here are live meters; the bank's own pictures are batch 2b's. SAMPLE data.</p>
</div>
<script>
(function () {
  var H = window.Horde, T = Math.PI * 2;
  var S = new H.Session({ x: 0, y: 0, sources: [
    { id: 'lfo1', name: 'LFO 1', kind: 'lfo', f: function (t) { return .5 + .5 * Math.sin(t * T * .45); } },
    { id: 'lfo2', name: 'LFO 2', kind: 'lfo', f: function (t) { var p = (t * .16) % 1; return p < .5 ? p * 2 : 2 - p * 2; } },
    { id: 'env2', name: 'ENV 2', kind: 'env', f: function (t) { var p = t % 1.7; return p < .04 ? p / .04 : Math.exp(-(p - .04) * 3.2); } },
    { id: 'mac1', name: 'MACRO 1', kind: 'macro', f: function (t) { return .5 + .32 * Math.sin(t * T * .05); } },
    { id: 'r1', name: 'R', kind: 'engine', f: function (t) { return .5 + .4 * Math.sin(t * T * .11 + 1); } }
  ], mappings: [{ param: 'drive.drive', src: 'lfo1', pol: 'bi', depth: .2 }, { param: 'drive.tone', src: 'env2', pol: 'uni', depth: .3 }] });
  var pctf = function (x) { return Math.round(x * 100) + '%'; };
  [['drive.drive', 'Drive'], ['drive.tone', 'Tone'], ['drive.bloom', 'Bloom']].forEach(function (a) {
    var d = document.createElement('div'); document.getElementById('knobs').appendChild(d);
    H.Knob(d, { key: a[0], name: a[1], path: 'Drive · ' + a[1], vals: [.5, .5, .5, .5], def: .5, fmt: pctf }, S); });
  H.MapControl(document.getElementById('map'), S, { frame: document.getElementById('win') });
  H.SourceRows(document.getElementById('rows'), S, {});
  S.on(function () { document.body.classList.toggle('map-on', S.map.on); });
  var msg = document.getElementById('msg'); S.on(function () { msg.textContent = S.message; });
  S.selected = 'drive.drive'; S.start(); S.emit();
})();
</script>
</body>
</html>
