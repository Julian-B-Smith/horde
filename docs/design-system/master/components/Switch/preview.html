<!-- @dsCard group="Controls" height=360 subtitle="Toggle, enum pills and the stepper for stepped parameters; the dense faces (20 px, toggle 26 × 14) that keep a 28 px hit box and 28 px row pitch" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Switch</title></head>
<body>
<div class="hd-col" style="padding:14px 16px 4px; gap:6px">
  <div class="hd-row"><span class="hd-label" style="width:72px">One-shot</span>
    <button class="hd-toggle hd-focus" role="switch" aria-checked="false" aria-label="Env 2 · One-shot" id="t1"></button>
    <button class="hd-toggle hd-focus" role="switch" aria-checked="true" aria-label="Demo · on"></button>
    <button class="hd-toggle" role="switch" aria-checked="false" aria-label="Demo · disabled" disabled style="opacity:var(--opacity-disabled);cursor:default"></button>
    <span class="hd-hint" id="t1v">off</span></div>
  <div class="hd-row"><span class="hd-label" style="width:72px">Voicing</span>
    <div class="hd-pills" role="radiogroup" aria-label="Voice · Voicing" id="p1"></div></div>
  <div class="hd-row"><span class="hd-label" style="width:72px"><span class="hd-owned" style="--own:var(--cD)"><svg class="hd-glyph" viewBox="0 0 10 10" style="fill:var(--cD-tx)"><path d="M1.2 1.2h7.6v7.6H1.2Z"/></svg>Mode</span></span>
    <div class="hd-pills" role="radiogroup" aria-label="Blade 1 · Mode, owned by corner D" id="p2"></div></div>
  <div class="hd-row"><span class="hd-label" style="width:72px">Polyphony</span>
    <div class="hd-stepper" role="spinbutton" aria-label="Voice · Polyphony" aria-valuemin="1" aria-valuemax="64" tabindex="0" id="st">
      <button type="button" tabindex="-1" aria-label="fewer"><svg viewBox="0 0 8 8"><path d="M6 0v8L1 4z"/></svg></button>
      <output class="hd-value" id="stv">16</output>
      <button type="button" tabindex="-1" aria-label="more"><svg viewBox="0 0 8 8"><path d="M2 0v8l5-4z"/></svg></button>
    </div>
    <span class="hd-hint">voices</span></div>
</div>
<div class="hd-col hd-dense" style="padding:8px 16px 4px; gap:0; border-top:1px dashed var(--div); margin:6px 16px 0; padding-left:0">
  <span class="hd-cluster" style="margin:2px 0 2px">Dense (.hd-dense)</span>
  <div class="hd-row" style="gap:0 6px"><span class="hd-label" style="width:60px">One-shot</span>
    <button class="hd-toggle hd-focus" role="switch" aria-checked="false" aria-label="Env 2 · One-shot (dense)" id="dt1"></button>
    <button class="hd-toggle hd-focus" role="switch" aria-checked="true" aria-label="Demo · on (dense)"></button>
    <span class="hd-label" style="width:42px; margin-left:12px">Octave</span>
    <div class="hd-stepper" role="spinbutton" aria-label="Sub · Octave" aria-valuemin="-3" aria-valuemax="3" tabindex="-1" id="dst">
      <button type="button" tabindex="-1" aria-label="lower"><svg viewBox="0 0 8 8"><path d="M6 0v8L1 4z"/></svg></button>
      <output class="hd-value" id="dstv">−1</output>
      <button type="button" tabindex="-1" aria-label="higher"><svg viewBox="0 0 8 8"><path d="M2 0v8l5-4z"/></svg></button>
    </div></div>
  <div class="hd-row" style="gap:0 6px; align-items:flex-start"><span class="hd-label" style="width:60px; line-height:28px">Mode</span>
    <div class="hd-pills" role="radiogroup" aria-label="Blade 1 · Mode (dense)" id="dp2" style="max-width:300px"></div></div>
  <div class="hd-row" style="gap:0 6px"><span class="hd-label" style="width:60px">Wave</span>
    <div class="hd-pills" role="radiogroup" aria-label="Blade 1 · Wave (dense)" id="dp3"></div></div>
</div>
<p class="hd-hint" style="margin:4px 16px 12px">Every face keeps a 28 px hit box; the active pill is ink-filled · dense: 20 px faces, wrapped pill rows at 28 px pitch (the faces 8 px apart, the hit boxes touching)</p>
<script>
(function () {
  var t1 = document.getElementById('t1'), t1v = document.getElementById('t1v');
  t1.addEventListener('click', function () { var on = t1.getAttribute('aria-checked') !== 'true'; t1.setAttribute('aria-checked', String(on)); t1v.textContent = on ? 'on' : 'off'; });
  function pills(id, opts, cur) {
    var g = document.getElementById(id);
    opts.forEach(function (o, i) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'hd-pill hd-focus'; b.setAttribute('role', 'radio'); b.textContent = o;
      b.setAttribute('aria-checked', String(i === cur)); b.tabIndex = i === cur ? 0 : -1;
      b.addEventListener('click', function () { g.querySelectorAll('.hd-pill').forEach(function (x) { x.setAttribute('aria-checked', String(x === b)); x.tabIndex = x === b ? 0 : -1; }); });
      g.appendChild(b);
    });
  }
  pills('p1', ['poly', 'mono', 'legato'], 0);
  pills('p2', ['Sync', 'FM reset', 'FM free', 'Noise', 'Fold', 'Ring', 'Crush'], 0);
  pills('dp2', ['Sync', 'FM reset', 'FM free', 'Noise', 'Fold', 'Ring', 'Crush'], 4);
  pills('dp3', ['Sine', 'Tri', 'Saw', 'Rev saw', 'Square', 'Sine→Saw'], 2);
  var dt1 = document.getElementById('dt1'); dt1.addEventListener('click', function () { dt1.setAttribute('aria-checked', String(dt1.getAttribute('aria-checked') !== 'true')); });
  (function () { var v = -1, o = document.getElementById('dstv'), b = document.querySelectorAll('#dst button');
    function put(x) { v = Math.max(-3, Math.min(3, x)); o.textContent = (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v); document.getElementById('dst').setAttribute('aria-valuenow', v); }
    b[0].addEventListener('click', function () { put(v - 1); }); b[1].addEventListener('click', function () { put(v + 1); }); put(-1); })();
  var st = document.getElementById('st'), stv = document.getElementById('stv'), n = 16;
  var set = function (x) { n = Math.max(1, Math.min(64, x)); stv.textContent = n; st.setAttribute('aria-valuenow', n); };
  var bs = st.querySelectorAll('button');
  bs[0].addEventListener('click', function () { set(n - 1); }); bs[1].addEventListener('click', function () { set(n + 1); });
  st.addEventListener('keydown', function (e) { if (e.key === 'ArrowUp' || e.key === 'ArrowRight') set(n + 1); else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') set(n - 1); else return; e.preventDefault(); });
  set(16);
})();
</script>
</body>
</html>
