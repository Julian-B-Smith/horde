<!-- listening-pass — the gauntlet's BLIND listening pass. HYPERSAW, 2026-09-28.
     v1: ROADMAP B324 (records PR #819, branch lead-records-126). The human: "Help me organize
     the listening pass, please".
     v2: ROADMAP B340 (records PR #833, branch lead-records-135), after the human completed v1:
     "I completed the listening pass but I don't entirely trust it. Before I can feel certain
     about it, maybe we could add a simple sine or saw wave playing the same notes as a control
     so I know the root is coming through. Also adding a pitch sweep would be helpful to confirm
     there isn't any aliasing. And maybe the notes should play on a few octaves, and for a
     little bit longer." The goal of v2 is TRUST: the root and any aliasing must be audible, and
     the numbers must be shown to measure what the ear hears.

     WHY. B316's coherence metrics (tools/patchspace/metrics.mjs: aliasing, roughness, root
     presence, noise) are MEASUREMENTS with PROVISIONAL thresholds (gauntlet.mjs THRESH). P4
     fits the random-patch distributions to those thresholds, so the human's ears set them
     first. This page runs the pass; tools/patchspace/calibrate.mjs fits the thresholds from
     its export and PROPOSES them (it never applies anything).

     THE SAMPLE (unchanged in v2: the same 36 patches, seeds and file). docs/design/
     listening-pass.json, written offline by tools/patchspace/listening_sample.mjs from a
     gauntlet run: a stratified, seeded choice (per metric low / around the threshold / high;
     the roughness-origin split; clean and broken patches; two repeats). It holds SEEDS and
     MEASURED METRICS only. Every sound is REGENERATED here from its seed: the gauntlet's
     sampler (samplePatch over the SCALPEL lab's own parameter table and tapers, sliced from
     scalpel-interface-lab.html exactly as space.mjs slices it, and tools/patchspace/
     dependency_tree.json) and the COMPOSED engine loaded by the SCALPEL lab's route
     (razor-core.js and scalpel-horde-engine.js by <script src>, reference/swarmsaw.html's DSP
     section by fetch, so the page must be served: python3 tools/serve_labs.py).

     THE PROGRAM (v2). Per patch, seven SEGMENTS, each a fresh engine with the patch's render
     seed (the gauntlet's route, so nothing later in a segment can reach back): A1 A2 A3 A4 E5
     A5, each held 1.5 s then released 0.5 s, then a SWEEP A1 -> A6.
       - The two renders the gauntlet MEASURED are inside it, bit for bit (in Node): A3 is
         rendered in 512-sample blocks, so its first 0.5 s IS the TONAL render (gauntlet.mjs
         A_SCRIPT); E5 in 128, so its first 0.3 s IS the ALIAS render (B_SCRIPT). programFp()
         fingerprints those two prefixes and equals the committed `fp` (listening_pass_check T3).
         v1's separate short phrase is not played any more: v2 plays it as those prefixes.
       - THE SWEEP uses the engine's own continuous pitch path, `bend`: a smoothed `t`
         parameter in semitones (12 ms, razor-core.js render), which the SCALPEL lab maps
         octave/semi/fine onto and the swarm reads as f0 on its 16-sample tick
         (scalpel-horde-engine.js tickSwarm). A3 is held and bend runs -24 -> +36 semitones over
         5 s, with 0.25 s steady at each end, set once per 128-sample block through the
         engine's set(). The engine is not edited. (It also has RazorCore's mono glide and a
         per-note retune message {t:'re'}; bend is the one that moves a held voice smoothly.)
       - Levels: ONE gain per program by v1's LOUD rule over every held part (-20 dBFS RMS,
         -1 dBFS peak ceiling, at most +40 dB), so the notes keep their balance.
       - About 19 s of sound per patch, ~31 s with the answers, ~19 min for all 36 (~30 min
         with a reference before every patch). Every segment can be played alone or skipped.

     REFERENCE CONTROLS. A pure SINE and a band-limited SAW, ADDITIVE (every harmonic below
     20 kHz, faded out over 18-20 kHz, so nothing ever lies above Nyquist and nothing folds), on
     exactly the same notes, timing and bend path (the bend TARGET: the engine's 12 ms smoother
     is not modelled), level-matched by the same LOUD rule. S / W play the reference of what is
     selected (the whole program, one note, or the sweep); a setting plays one before each
     patch. They carry NO measurement and no patch information: the blind rule holds.

     MEASURE WHAT IS PLAYED. Every segment played for rating is measured with metrics.mjs
     (imported, never copied) by ONE function, measureWindows(): the gauntlet's own windows
     (tonal 0.4 s from 0.1 s; aliasing 0.25 s from 0.05 s, against the same patch at 4x its
     oversampling), SLID across the whole hold in half-window steps, the segment's value being
     its worst window. Its first window IS the gauntlet's measurement (check T12). One long
     window was tried first and REJECTED on evidence: over 1.45 s the aliasing of many patches
     reads the -120 dB floor while every 0.25 s part of the same render reads -20 to -33 dB
     (see measureWindows). The sweep holds no single pitch: aliasing only, windowed the same
     way, with the pitch at the worst window. Measurement runs in the background (every render
     is chunked, so the page stays responsive), is never shown before the reveal, and the v2
     export carries it per segment with the program's id (PHRASE_ID). calibrate.mjs fits a v2
     export against the WORST segment per metric; v1 exports validate and fit as before.

     DETECTOR CONTROLS (the detector-shares-assumption trap: a detector must read zero where it
     should and high where it should). detectorControls() runs the SAME measureWindows() on
     signals whose answer is known by construction: the sine reads clean, root-clear and not
     noisy on every note; a NAIVE saw (2*phase - 1) reads aliased at E5 (held, and with a
     30-cent vibrato: the engine's partials move) and on the sweep, the additive saw clean in
     all three; a sine a tritone off the note reads root-unclear; seeded noise reads noisy. For generated signals the aliasing reference is the same generator at 4x the
     SAMPLE RATE, its spectrum taken with 4x the points so the bins are the same width. It runs
     here (self-check 5) and in listening_pass_check (T10). B351: against the live gauntlet.mjs
     THRESH (T10), whose aliasing gate is now B346's os-convergence estimator (aliasConvDb), the
     saws' aliased/clean verdicts are read by that estimator (convTone: the tone at 1x..16x the
     rate) and the vibrato at A3 and a glide at E5 and A3 are added; the page's own self-check
     passes the sample's frozen thresholds and reads B345's aliasing as before. A MEASURED LIMIT, reported not
     hidden: at A1/A2 the root metric cannot tell a semitone (a sine a semitone sharp still
     reads root-clear there: 8192-point bins are 5.9 Hz, a semitone at A1 is 3.3 Hz).
     The CALIBRATE YOUR EARS step plays the naive-vs-band-limited saw pair (held E5 and the
     sweep) with the detector's verdict beside each, before any patch is rated.

     THE HUMAN'S v1 PASS. Its answers live in localStorage under 'hypersaw.b324.listening-pass'.
     This page only READS that key (listening_pass_check T11 proves no write in this file can
     reach it; self-check 6 shows it unchanged since load) and offers EXPORT THE V1 PASS at the
     top of the landing view whenever it holds answers, producing the exact v1 file. The pass
     may have been rated on the EARLIER B324 sample (03c97d3e, replaced by the B325 re-selection
     the same day; no patch in common), so the page carries enough of that sample (V1_SAMPLES)
     to export either exactly, and says which one the saved pass belongs to. v2 keeps its own
     key, 'hypersaw.b340.listening-pass'.

     WHAT THE EAR GETS vs WHAT WAS MEASURED (the B324 finding). Chrome's sin/exp/tanh differ
     from Node's in their last bits (Chrome 153 vs Node 24), so a browser render is not
     bit-identical to the gauntlet's; the PATCH is (`ph`: the sampler reads pow alone). The page
     measures the two measured windows (measureHeard) against the committed numbers and marks a
     patch outside TOL `heard: drift`. In v2 that mark is informational: the fit uses the
     numbers measured where the rating was made. ?xverify=1 runs the whole sample (differences
     only for the patches, plus the detector controls' own numbers).

     BLIND. Before the reveal the DOM holds no metric name, value, stratum or role: the rating
     view is built from the patch's KEY alone, and a scan of every non-script element runs
     after each view change against the exact strings the reveal would print (self-check 3,
     with the reveal itself as its must-read-high control). The order is v1's seeded shuffle
     (the sample's orderSeed); the two repeats sit half the list away from their originals.
     Developer numbers (xverify, detector controls) are printed with a middle-dot decimal
     point, which no revealed value contains, so they cannot trip or hide from the scan.

     THE PURE BLOCK (between the PURE-BEGIN / PURE-END markers): the sampler, the render route
     (renderSteps, a generator so the page can yield between blocks; renderScript runs it to
     the end), the program, the measurements, the reference tones, the detector controls, the
     order, the views and both export builders, with no DOM, audio or fetch.
     tools/patchspace/listening_pass_check.mjs slices it and proves it (see that file).

     RESUMABLE (localStorage, every access in try/catch). EXPORT: JSON without timestamps (the
     order index is the sequence), saved by the human into local/patchspace/ratings/
     (git-ignored). URL: ?theme=dark, ?demo=landing|calib|rate|reveal (screenshot states with
     SYNTHETIC answers, labelled as such, never saved), ?xverify=1.

     B345 (2026-09-28, the human: "Let's fix the metrics first, then re-fit"). metrics.mjs's
     aliasing was fixed (it went blind over long windows, and read two renders of the same noise
     as folding) and a noise measure, noiseDb, was added beside flatness; measureWindows records
     it per segment. listening-pass.json was re-measured IN PLACE (same patches, seeds and order),
     so its id changed; the file lists the ids it replaced (`remeasured`) and this page treats a
     pass saved against one of them as a pass on the same sounds: the v1 pass still exports
     exactly, and a v2 pass keeps its answers while its segments are measured again with the
     fixed metrics (sameSoundsAs, load).

     L0026: every const is declared above the code that runs at setup; the boot call is the
     last statement of the script. -->

"use strict";
/* ======================================================================
   A. PURE — sampler, render route, program, measurements, reference tones, detector controls,
   order, views, exports. No DOM, no audio, no fetch, no clock.
   tools/patchspace/listening_pass_check.mjs slices this block and runs it in Node.
   ====================================================================== */
// PURE-BEGIN
const SR = 48000;                                   // the SCALPEL lab's rate (space.mjs SR)
const RENDER_SALT = 77;                             // gauntlet.mjs: render seed = hash32(run, i, 77)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* gen_dependency_tree.mjs hash32, verbatim */
function hash32(...xs) { let h = 0x811C9DC5; for (const x of xs) { h ^= x >>> 0; h = Math.imul(h, 0x01000193) >>> 0; h ^= h >>> 13; } return h >>> 0; }
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
/* space.mjs evalCond, verbatim (the dependency tree's JSON condition grammar) */
function evalCond(c, P, preds) {
  if (c === true || c === false) return c;
  const op = Object.keys(c)[0], a = c[op];
  switch (op) {
    case 'all': return a.every(x => evalCond(x, P, preds));
    case 'any': return a.some(x => evalCond(x, P, preds));
    case 'not': return !evalCond(a, P, preds);
    case 'pred': if (!preds[a]) throw new Error('evalCond: unknown predicate ' + a); return evalCond(preds[a], P, preds);
    case 'eq': return P[a[0]] === a[1];
    case 'ne': return P[a[0]] !== a[1];
    case 'in': return a[1].includes(P[a[0]]);
    case 'ge': return P[a[0]] >= a[1];
    case 'gt': return P[a[0]] > a[1];
    case 'le': return P[a[0]] <= a[1];
    case 'absgt': return Math.abs(P[a[0]]) > a[1];
    default: throw new Error('evalCond: unknown operator ' + op);
  }
}
function asEvalTree(json) {
  return { predicates: Object.fromEntries(Object.entries(json.predicates).map(([n, p]) => [n, p.when])),
    params: Object.fromEntries(Object.entries(json.params).map(([k, p]) => [k, { active_when: p.active_when }])) };
}
/* the SCALPEL lab's parameter table and tapers, SLICED from the lab and evaluated — the same
   anchors as space.mjs loadLab, so a lab edit reaches this sampler as it reaches the gauntlet */
function sliceBetween(src, a, b, what) {
  const i = src.indexOf(a), j = i < 0 ? -1 : src.indexOf(b, i + a.length);
  if (i < 0 || j < 0) throw new Error(`${what}: anchors "${a}" .. "${b}" not found in scalpel-interface-lab.html`);
  return src.slice(i, j);
}
function labFrom(html) {
  const table = sliceBetween(html, 'const E_MODE', 'const TIER_RANK', 'parameter table');
  const curves = sliceBetween(html, 'function toPos(', 'function fmtHz(', 'toPos/fromPos');
  const frac = x => x - Math.floor(x), clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  return new Function('frac', 'clamp', '"use strict";\n' + table + '\n' + curves + '\nreturn { SP, toPos, fromPos };')(frac, clamp);
}
/* space.mjs loadSpace: the lab rows the engine voices, in the lab's key order (the substream
   index is this order's position, so it must match exactly), defaults from an engine instance */
function spaceFrom(lab, inst) {
  const engineKeys = new Set(Object.keys(inst.t).concat(Object.keys(inst.d), ['os']));
  const defaults = Object.assign({}, inst.t, inst.d, { os: inst.os, b1on: 1 });
  const params = [];
  for (const key of Object.keys(lab.SP)) {
    const sp = lab.SP[key];
    if (!(key === 'b1on' || engineKeys.has(key)) || !'cets'.includes(sp.kind)) continue;
    params.push({ key, kind: sp.kind, curve: sp.curve, opts: sp.opts ? sp.opts.filter(o => !o[2]).map(o => o[0]) : null, default: defaults[key] });
  }
  return { params, defaults };

  if (ST.order.some(k => answered(ST.answers[k]) && !ST.segs[k])) { setStat({ text: 'measuring the answered patches before the export…', warn: false }); await measureAnswered(); }
  const x = buildExportV2(ST, SAMPLE, CAL.SCHEMA_V2), v = CAL.validateExport(x);
  if (!v.ok) { alert('export failed its own schema: ' + v.errors.join('; ')); return; }
  download(x, `listening-pass-v2-ratings-${SAMPLE.id}.json`);
}
function exportV1() {
  if (DEMO) return;
  const x = exportV1FromStore(readV1().s, SAMPLE, CAL.SCHEMA);
  if (!x) { alert('the v1 pass in this browser was made on a sample this page does not know'); return; }
  const v = CAL.validateExport(x);
  if (!v.ok) { alert('the v1 export failed the v1 schema: ' + v.errors.join('; ')); return; }
  download(x, `listening-pass-ratings-${x.sample.id}.json`);    // the v1 page's own file name, for the sample it was rated on
}
function playCalib(id) { playSeq([{ what: 'calib', prog: calibSignal(id), sel: -1 }]); }
function wire() {
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on('bStart', start); on('bReset', resetAll); on('bCalib', () => go('calib')); on('bHome', () => go('intro')); on('bExportV1', exportV1);
  on('bPlay', () => playPatch(-1, false)); on('bSweep', () => playPatch(SEG_SWEEP, false)); on('bStop', stop);
  on('bSine', () => playRef('sine')); on('bSaw', () => playRef('saw'));
  on('bLoop', () => { ST.loop = !ST.loop; save(); const b = $('bLoop'); if (b) { b.classList.toggle('on', ST.loop); b.innerHTML = `LOOP ${ST.loop ? 'ON' : 'OFF'} <kbd>L</kbd>`; } });
  on('bRefB', cycleRefBefore);
  on('bNext', next); on('bPrev', prev); on('bExport', exportRatings); on('bReveal', reveal);
  on('bBack', () => { ST.cursor = ST.order.length - 1; go('rate'); });
  for (const b of document.querySelectorAll('.ans')) b.onclick = () => answer(b.dataset.q, +b.dataset.v);
  for (const b of document.querySelectorAll('.seg')) b.onclick = () => playPatch(+b.dataset.seg, false);
  for (const b of document.querySelectorAll('[data-cal]')) b.onclick = () => playCalib(b.dataset.cal);
  for (const b of document.querySelectorAll('[data-play]')) b.onclick = async () => { stop(); const p = await programOf(b.dataset.play); playSeq([{ what: 'patch', prog: p, sel: -1 }]); };
  const note = $('note');
  if (note) note.oninput = () => { const key = ST.order[ST.cursor]; (ST.answers[key] || (ST.answers[key] = {})).note = note.value; save(); };
}
function cycleRefBefore() {
  ST.refBefore = REF_BEFORE[(REF_BEFORE.indexOf(ST.refBefore) + 1) % REF_BEFORE.length]; save();
  const b = $('bRefB'); if (b) b.innerHTML = `${ST.refBefore.toUpperCase()} <kbd>B</kbd>`;
}
const CAL_KEYS = { 1: 'saw-E5', 2: 'naive-E5', 3: 'saw-sweep', 4: 'naive-sweep', 5: 'sine-sweep' };
function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && t.tagName === 'INPUT') { if (e.key === 'Escape' || e.key === 'Enter') { t.blur(); e.preventDefault(); } return; }
  const k = e.key;
  if (ST.view === 'intro' && k === 'Enter') { e.preventDefault(); if (ST.calibrated) start(); else go('calib'); return; }
  if (ST.view === 'calib') {
    if (CAL_KEYS[k]) { playCalib(CAL_KEYS[k]); return; }
    if (k === 'Enter') { e.preventDefault(); start(); } else if (k === 'x' || k === 'X' || k === ' ') { e.preventDefault(); stop(); }
    else if (k === 'Escape' || k === 'ArrowLeft') go('intro');
    return;
  }
  if ((ST.view === 'done' || ST.view === 'reveal') && (k === 'e' || k === 'E')) { exportRatings(); return; }
  if (ST.view === 'done' && (k === 'r' || k === 'R')) { reveal(); return; }
  if (ST.view !== 'rate') return;
  const qi = '1234567890'.indexOf(k);
  if (qi >= 0) { answer(QUI[qi >> 1].key, qi & 1); e.preventDefault(); return; }
  if (k === ' ') { playPatch(-1, false); e.preventDefault(); }
  else if (k === 'p' || k === 'P') playPatch(SEG_SWEEP, false);
  else if (k === ']') stepSeg(1);
  else if (k === '[') stepSeg(-1);
  else if (k === 's' || k === 'S') playRef('sine');
  else if (k === 'w' || k === 'W') playRef('saw');
  else if (k === 'x' || k === 'X') stop();
  else if (k === 'b' || k === 'B') cycleRefBefore();
  else if (k === 'l' || k === 'L') { const b = $('bLoop'); if (b) b.click(); }
  else if (k === 'Enter' || k === 'ArrowRight') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'Backspace') { e.preventDefault(); prev(); }
  else if (k === 'n' || k === 'N') { const n = $('note'); if (n) { n.focus(); e.preventDefault(); } }
  else if (k === 'e' || k === 'E') exportRatings();
}

/* ======================================================================
   E. SELF-CHECKS — shown without a single measured patch number (blindness holds here too)
   ====================================================================== */
function selfChecks() {
  const rows = [], it0 = SAMPLE.items[0], run = SAMPLE.run.seed;
  /* 1. DETERMINISM. Exact where exactness is possible: every seed regenerates its committed patch
        (the sampler reads pow alone, which both runtimes share) and the measured segments
        rendered twice here are bit-identical. Within tolerance where it is not: the measured
        windows of what is played here measure like the committed numbers. */
  const ph = SAMPLE.items.filter(it => patchHash(patchOf(it.key)) === it.ph).length;
  const p0 = patchOf(it0.key), s0 = pseedOf(run, it0.i);
  const seg2 = () => [SEG_A3, SEG_E5].map(k => runSync(renderSegmentSteps(ENG.C, p0, s0, SEGS[k])));
  const r1 = seg2(), r2 = seg2(), f1 = fingerprint(r1[0].L, r1[0].R, r1[1].L, r1[1].R), f2 = fingerprint(r2[0].L, r2[0].R, r2[1].L, r2[1].R);
  const fpHere = fingerprint(r1[0].L.subarray(0, MEAS.tonal.n), r1[0].R.subarray(0, MEAS.tonal.n), r1[1].L.subarray(0, MEAS.alias.n), r1[1].R.subarray(0, MEAS.alias.n));
  const d0 = heardDiff(measureHeard(MET, ENG.C, p0, s0, r1[0], r1[1]), it0.metrics);
  rows.push({ name: 'determinism', ok: ph === SAMPLE.items.length && f1 === f2 && d0.ok,
    text: `every seed regenerates its committed patch (${ph}/${SAMPLE.items.length}); segments rendered twice here are bit-identical (${f1 === f2 ? 'yes' : 'NO'}); ` +
      `the first patch's measured windows are within tolerance (${d0.ok ? 'yes' : 'NO: ' + d0.over.map(o => o.k).join(', ')}); ` +
      `bit-identical to the gauntlet's Node render: ${fpHere === it0.fp ? 'yes' : 'no (this browser\'s sin, exp and tanh are not Node\'s)'}` });
  /* 2. MUST-FAIL. A perturbed seed (index + 1) regenerates a different patch, and its sound,
        measured here, is flagged against the committed numbers of the seed it replaced. */
  const pp = samplePatch(ENG.ctx, run, it0.i + 1, it0.mode).patch, sp = pseedOf(run, it0.i + 1);
  const rp = [SEG_A3, SEG_E5].map(k => runSync(renderSegmentSteps(ENG.C, pp, sp, SEGS[k])));
  const dp = heardDiff(measureHeard(MET, ENG.C, pp, sp, rp[0], rp[1]), it0.metrics);
  rows.push({ name: 'perturbed seed', ok: patchHash(pp) !== it0.ph && !dp.ok,
    text: `the neighbouring seed is a different patch (${patchHash(pp) !== it0.ph ? 'caught' : 'MISSED'}) and a different sound (${!dp.ok ? 'caught' : 'MISSED'})` });
  /* 3. BLINDNESS, with the reveal as its must-read-high control (a scanner that finds nothing
        anywhere proves nothing); re-scanned after every view change (blindCheck) */
  const A = CAL.analyse(SAMPLE, [buildExportV2(ST, SAMPLE, CAL.SCHEMA_V2)]);
  const ctl = blindScan(viewReveal(ST, SAMPLE, A, {}, null, false), CHECK.tokens);
  rows.push({ name: 'blind', ok: null, ctl: ctl.length, text: '' });
  /* 4. EXPORTS: v2 passes calibrate's validator and a timestamped one does not; the v1 pass (or a
        synthetic stand-in when this browser holds none) exports in the exact v1 format */
  const x = buildExportV2(ST, SAMPLE, CAL.SCHEMA_V2), v = CAL.validateExport(x);
  const vb = CAL.validateExport(Object.assign({}, x, { savedAt: 'wall clock' }));
  const qk = QUI.map(q => q.key).join() === CAL.QUESTIONS.map(q => q.key).join();
  const v1s = readV1().s, known = !!(v1s && v1s.answers && v1SampleOf(v1s.sampleId, SAMPLE));
  const v1x = exportV1FromStore(known ? v1s : { sampleId: SAMPLE.id, answers: {}, heard: {} }, SAMPLE, CAL.SCHEMA);
  const v1ok = !!v1x && CAL.validateExport(v1x).ok && v1x.schema === CAL.SCHEMA;
  rows.push({ name: 'exports', ok: v.ok && !vb.ok && qk && v1ok, text: `the v2 export validates (${v.ok ? 'yes' : 'NO: ' + v.errors[0]}), a timestamped one is rejected (${vb.ok ? 'MISSED' : 'caught'}), ` +
    `the questions match calibrate.mjs (${qk ? 'yes' : 'NO'}), the ${known ? 'saved v1 pass' : 'v1 format (no v1 pass in this browser)'} exports as v1 (${v1ok ? 'yes' : 'NO'})` });
  CHECK.rows = rows;
}
/* 5. DETECTOR CONTROLS (after first paint: ~1-3 s of known signals through measureWindows) */
function detectorCheck() {
  const det = detectorControls(MET, SAMPLE.thresholds), asserted = det.filter(r => r.ok !== null), bad = asserted.filter(r => !r.ok);
  CHECK.det = det;
  const verdict = id => { const r = det.find(x => x.id === id); return r ? (r.m.aliasDb > SAMPLE.thresholds.aliasDb ? 'aliased' : 'clean') : null; };
  CHECK.verdicts = { e5: { saw: verdict('band-limited saw E5'), naive: verdict('naive saw E5') }, sweep: { saw: verdict('band-limited saw sweep'), naive: verdict('naive saw sweep'), sine: verdict('sine sweep') } };
  const n = k => det.filter(r => r.id.startsWith(k) && r.ok).length, of = k => det.filter(r => r.id.startsWith(k)).length;
  const semi = det.filter(r => r.ok === null && r.m.rootPresence >= SAMPLE.thresholds.rootPresence).map(r => r.id.split(' ').pop());
  CHECK.rows.push({ name: 'detector controls', ok: bad.length === 0,
    text: `the reference sine reads clean, root clear and not noisy on ${n('sine A') + n('sine E')}/${of('sine A') + of('sine E')} notes and clean on the sweep (${n('sine sweep') ? 'yes' : 'NO'}); ` +
      `a naive saw reads aliased at E5, held and with vibrato (${n('naive saw E5')}/${of('naive saw E5')}), and on the sweep (${n('naive saw sweep') ? 'yes' : 'NO'}); ` +
      `the clean saw reads clean there (${n('band-limited saw')}/${of('band-limited saw')}); ` +
      `a tritone-off sine reads root unclear on ${n('tritone')}/${of('tritone')}; seeded noise reads noisy (${n('seeded') ? 'yes' : 'NO'})` +
      (bad.length ? ` — FAILED: ${bad.map(r => r.id).join(', ')}: the metric is broken there` : '') +
      (semi.length ? `; LIMIT: a sine a semitone sharp still reads root clear at ${semi.join(', ')}` : '') });
  if (ST.view === 'calib') render();
  paintAudit();
}
/* ?xverify=1 — the developer's cross-runtime pass: every patch's measured windows rendered and
   measured HERE, as DIFFERENCES from the committed numbers (never the numbers), against TOL;
   then every segment of every patch measured (what the pass itself does), with its cost */
async function crossVerify() {
  const lines = [], fmt = x => (x === null || x === undefined || !Number.isFinite(x) ? 'n/a' : 'Δ' + Math.abs(x).toExponential(1));
  let okN = 0;
  for (const it of SAMPLE.items) {
    const p = patchOf(it.key), sd = pseedOf(SAMPLE.run.seed, it.i), rs = [SEG_A3, SEG_E5].map(k => runSync(renderSegmentSteps(ENG.C, p, sd, SEGS[k])));
    const h = measureHeard(MET, ENG.C, p, sd, rs[0], rs[1]), d = heardDiff(h, it.metrics); if (d.ok) okN++;
    lines.push(`${it.key.padEnd(12)} ${d.ok ? 'within ' : 'OUTSIDE'}  ` + Object.keys(TOL).map(k => `${k.slice(0, 5)} ${fmt(h[k] - it.metrics[k])}`).join('  ') +
      (d.ok ? '' : '  over: ' + d.over.map(o => `${o.k} x${o.over.toFixed(1)}`).join(', ')));
    CHECK.xv = `CROSS-RUNTIME (developer, ?xverify=1): ${okN}/${SAMPLE.items.length} patches' measured windows within tolerance so far…`; paintAudit(); await tick();
  }
  const head = `CROSS-RUNTIME (developer, ?xverify=1): ${okN}/${SAMPLE.items.length} patches' measured windows are within tolerance here`;
  /* the full program, every segment measured, per patch; the cost is the page's own adapter
     timing (performance.now around the work, never inside the DSP) */
  const cost = [], bad = [];
  for (const it of SAMPLE.items) {
    const t0 = performance.now(), prog = await programOf(it.key), t1 = performance.now();
    const segs = []; for (let k = 0; k < SEGS.length; k++) segs.push(await drive(measureSegmentSteps(MET, ENG.C, prog.patch, prog.pseed, SEGS[k], prog.rs[k], STEP)));
    const t2 = performance.now();
    const v = CAL.validateExport({ schema: CAL.SCHEMA_V2, sample: { file: 'x', id: SAMPLE.id }, orderSeed: 0, phrase: { version: 2, id: PHRASE_ID }, complete: false,
      ratings: [{ order: 0, key: it.key, run: SAMPLE.run.seed, i: it.i, mode: it.mode, answers: Object.fromEntries(QUI.map(q => [q.key, null])), note: '', heard: null, segs }] });
    if (!v.ok) bad.push(it.key + ': ' + v.errors[0]);
    cost.push([t1 - t0, t2 - t1]);
    AUD.progs.delete(it.key);
    CHECK.xv = head + `\nfull program: ${cost.length}/${SAMPLE.items.length} patches rendered and measured so far…\n` + lines.join('\n'); paintAudit(); await tick();
  }
  const med = a => { const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; }, mx = a => Math.max(...a);
  const ren = cost.map(c => c[0] / 1000), mea = cost.map(c => c[1] / 1000);
  CHECK.xv = head + `\nfull program (${SEGS.length} segments): ${cost.length - bad.length}/${cost.length} patches' per-segment numbers pass the v2 schema` + (bad.length ? ' — ' + bad.join('; ') : '') +
    `; page-clock s per patch (NOT wall time when headless Chrome runs on virtual time): render median ${fmtDev(med(ren))}, max ${fmtDev(mx(ren))}; measure median ${fmtDev(med(mea))}, max ${fmtDev(mx(mea))}\n` +
    `DETECTOR CONTROLS (known signals, same code):\n${(CHECK.det || []).map(detectorLine).join('\n')}\n` + lines.join('\n');
  paintAudit();
}
function paintAudit() {
  const el = $('audit'); if (!el) return;
  if (ENG.err) { el.className = 'audit bad'; el.textContent = ENG.err; return; }
  if (!CHECK.rows.length) { el.textContent = ''; return; }
  const blind = CHECK.rows.find(r => r.name === 'blind');
  if (blind) {
    blind.ok = CHECK.blindHits.length === 0 && blind.ctl > 0;
    blind.text = ST.revealed ? `blind until the reveal (${CHECK.blindScans} scans before it, ${CHECK.blindHits.length} leaks)` :
      `the page shows no measurement (${CHECK.blindScans} scans, ${CHECK.blindHits.length} leaks); the reveal's own text trips the same scan (${blind.ctl > 0 ? 'caught' : 'MISSED'})`;
  }
  /* 6. the human's v1 pass: byte-identical to what it was when this page loaded */
  let v1row = null;
  if (CHECK.v1Boot !== null) { const now = readV1().raw; v1row = { name: 'v1 pass untouched', ok: now === CHECK.v1Boot.raw, text: CHECK.v1Boot.raw ? `the saved v1 answers are unchanged since load (${now === CHECK.v1Boot.raw ? 'yes' : 'NO'})` : 'no v1 pass in this browser (nothing to protect)' }; }
  const all = v1row ? CHECK.rows.concat([v1row]) : CHECK.rows;
  const n = all.filter(r => r.ok).length, hv = Object.values(ST.heard), drift = hv.filter(h => h === 'drift').length;
  el.className = 'audit' + (n === all.length ? '' : ' bad');
  el.innerHTML = `SELF-CHECKS <span class="${n === all.length ? 'ok' : 'no'}">${n}/${all.length}</span>${CHECK.det ? '' : ' (detector controls running…)'} · ` +
    all.map(r => `<span class="${r.ok ? 'ok' : 'no'}">${r.ok ? 'OK' : 'FAIL'}</span> ${esc(r.name)}: ${esc(r.text)}`).join(' · ') +
    ` · measured here so far: ${hv.length - drift} match, ${drift} drift` + (DEMO ? ' · <span class="demo">DEMO STATE, not saved</span>' : '') +
    (CHECK.xv ? '<pre class="cmd">' + esc(CHECK.xv) + '</pre>' : '');
}

/* ======================================================================
   F. BOOT
   ====================================================================== */
function applyTheme() {
  document.body.classList.toggle('dark', ST.theme === 'dark');
  const b = $('themeBtn'); if (b) b.innerHTML = 'theme <b>' + ST.theme.toUpperCase() + '</b>';
}
/* a screenshot state with SYNTHETIC answers (a seeded rater), labelled on screen and never saved */
function demoFill(upto) {
  const rng = mulberry32(0xDE30);
  ST.order.slice(0, upto).forEach(key => { const a = {}; for (const q of QUI) a[q.key] = rng() < 0.35 ? 1 : 0; ST.answers[key] = a; });
}
async function boot() {
  applyTheme();
  const tb = $('themeBtn'); if (tb) tb.onclick = () => { ST.theme = ST.theme === 'dark' ? 'light' : 'dark'; applyTheme(); };
  try { await loadAll(); } catch (e) {
    ENG.err = 'the page could not start: ' + String(e && e.message || e) + ' — serve the repo: python3 tools/serve_labs.py';
    paintAudit(); const app = $('app'); if (app) app.innerHTML = '<div class="card"><p>' + esc(ENG.err) + '</p></div>'; return;
  }
  ST.order = presentationOrder(SAMPLE.items, SAMPLE.orderSeed);
  CHECK.tokens = blindTokens(SAMPLE);
  CHECK.v1Boot = readV1();
  if (DEMO === 'rate') { demoFill(6); ST.answers[ST.order[6]] = { aliased: 0, rough: 1, rootUnclear: 0 }; ST.cursor = 6; ST.calibrated = true; }
  else if (DEMO === 'reveal') {
    demoFill(ST.order.length); ST.revealed = true;
    /* SYNTHETIC heard segments: the committed numbers as one pseudo-segment, labelled in the reveal */
    for (const k of ST.order) { const m = SAMPLE.itemsByKey[k].metrics; ST.segs[k] = [{ seg: 'A3', aliasDb: m.aliasDb, roughness: m.roughness, rootPresence: m.rootPresence, rootInterval: m.rootInterval, flatness: m.flatness, rmsDb: m.rmsDb }]; ST.heard[k] = 'match'; }
  } else if (!DEMO) {
    const s = load();
    if (s) Object.assign(ST, { answers: s.answers || {}, heard: s.heard || {}, segs: s.segs || {}, cursor: Math.min(s.cursor || 0, ST.order.length - 1), revealed: !!s.revealed,
      loop: !!s.loop, refBefore: REF_BEFORE.includes(s.refBefore) ? s.refBefore : 'off', calibrated: !!s.calibrated });
  }
  try { selfChecks(); } catch (e) { CHECK.rows.push({ name: 'self-checks', ok: false, text: 'threw: ' + String(e && e.message || e) }); }
  document.addEventListener('keydown', onKey);
  if (DEMO === 'rate') { ST.view = 'rate'; render(); background(); }
  else if (DEMO === 'calib') { ST.view = 'calib'; render(); }
  else { ST.view = DEMO === 'reveal' || ST.revealed ? 'reveal' : 'intro'; render(); }
  paintAudit();
  await tick();
  try { detectorCheck(); } catch (e) { CHECK.rows.push({ name: 'detector controls', ok: false, text: 'threw: ' + String(e && e.message || e) }); paintAudit(); }
  if (ST.view === 'reveal') render();
  if (XVERIFY) { try { await crossVerify(); } catch (e) { CHECK.xv = 'cross-runtime pass threw: ' + String(e && e.message || e); paintAudit(); } }
}
boot().catch(e => { ENG.err = 'boot failed: ' + String(e && e.stack || e); try { paintAudit(); } catch (_) {} });
</script>
