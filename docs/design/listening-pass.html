}
function exportRatings() {
  const x = buildExport(ST, SAMPLE, CAL.SCHEMA), v = CAL.validateExport(x);
  if (!v.ok) { alert('export failed its own schema: ' + v.errors.join('; ')); return; }
  const url = URL.createObjectURL(new Blob([JSON.stringify(x, null, 1) + '\n'], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = `listening-pass-ratings-${SAMPLE.id}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function wire() {
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on('bStart', start); on('bReset', resetAll); on('bReplay', () => play(ST.order[ST.cursor]));
  on('bLoop', () => { ST.loop = !ST.loop; render(); if (AUD.playing) play(ST.order[ST.cursor]); });
  on('bNext', next); on('bPrev', prev); on('bExport', exportRatings); on('bReveal', reveal);
  on('bBack', () => { ST.cursor = ST.order.length - 1; go('rate'); });
  for (const b of document.querySelectorAll('.ans')) b.onclick = () => answer(b.dataset.q, +b.dataset.v);
  for (const b of document.querySelectorAll('[data-play]')) b.onclick = () => play(b.dataset.play);
  const note = $('note');
  if (note) note.oninput = () => { const key = ST.order[ST.cursor]; (ST.answers[key] || (ST.answers[key] = {})).note = note.value; save(); };
}
function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && t.tagName === 'INPUT') { if (e.key === 'Escape' || e.key === 'Enter') { t.blur(); e.preventDefault(); } return; }
  const k = e.key;
  if (ST.view === 'intro' && k === 'Enter') { e.preventDefault(); start(); return; }
  if ((ST.view === 'done' || ST.view === 'reveal') && (k === 'e' || k === 'E')) { exportRatings(); return; }
  if (ST.view === 'done' && (k === 'r' || k === 'R')) { reveal(); return; }
  if (ST.view !== 'rate') return;
  const qi = '1234567890'.indexOf(k);
  if (qi >= 0) { answer(QUI[qi >> 1].key, qi & 1); e.preventDefault(); return; }
  if (k === ' ') { play(ST.order[ST.cursor]); e.preventDefault(); }
  else if (k === 'l' || k === 'L') { ST.loop = !ST.loop; render(); play(ST.order[ST.cursor]); }
  else if (k === 'Enter' || k === 'ArrowRight') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'Backspace') { e.preventDefault(); prev(); }
  else if (k === 'n' || k === 'N') { const n = $('note'); if (n) { n.focus(); e.preventDefault(); } }
  else if (k === 'e' || k === 'E') exportRatings();
}

/* ======================================================================
   E. SELF-CHECKS — shown without a single measured number (blindness holds here too)
   ====================================================================== */
function selfChecks() {
  const rows = [], it0 = SAMPLE.items[0], run = SAMPLE.run.seed;
  /* 1. DETERMINISM. Exact where exactness is possible: every seed regenerates its committed patch
        (the sampler reads pow alone, which both runtimes share) and a render repeated here is
        bit-identical. Within tolerance where it is not: the sound played here measures like the
        committed numbers (see measureHeard: the browser's libm is not Node's). */
  const ph = SAMPLE.items.filter(it => patchHash(patchOf(it.key)) === it.ph).length;
  const p0 = patchOf(it0.key), s0 = pseedOf(run, it0.i);
  const r1 = renderPhrase(ENG.C, p0, s0), r2 = renderPhrase(ENG.C, p0, s0);
  const d0 = heardDiff(measureHeard(MET, ENG.C, p0, s0, r1.segs), it0.metrics);
  rows.push({ name: 'determinism', ok: ph === SAMPLE.items.length && r1.fp === r2.fp && d0.ok,
    text: `every seed regenerates its committed patch (${ph}/${SAMPLE.items.length}); a render repeated here is bit-identical (${r1.fp === r2.fp ? 'yes' : 'NO'}); ` +
      `the first patch measures within tolerance of its committed numbers (${d0.ok ? 'yes' : 'NO: ' + d0.over.map(o => o.k).join(', ')}); ` +
      `bit-identical to the gauntlet's Node render: ${r1.fp === it0.fp ? 'yes' : 'no (this browser\'s sin, exp and tanh are not Node\'s)'}` });
  /* 2. MUST-FAIL. A perturbed seed (index + 1) regenerates a different patch, and its sound,
        measured here, is flagged against the committed numbers of the seed it replaced. */
  const pp = samplePatch(ENG.ctx, run, it0.i + 1, it0.mode).patch, sp = pseedOf(run, it0.i + 1);
  const dp = heardDiff(measureHeard(MET, ENG.C, pp, sp, renderPhrase(ENG.C, pp, sp).segs), it0.metrics);
  rows.push({ name: 'perturbed seed', ok: patchHash(pp) !== it0.ph && !dp.ok,
    text: `the neighbouring seed is a different patch (${patchHash(pp) !== it0.ph ? 'caught' : 'MISSED'}) and a different sound (${!dp.ok ? 'caught' : 'MISSED'})` });
  /* 3. BLINDNESS, with the reveal as its must-read-high control (a scanner that finds nothing
        anywhere proves nothing); re-scanned after every view change (blindCheck) */
  const A = CAL.analyse(SAMPLE, [buildExport(ST, SAMPLE, CAL.SCHEMA)]);
  const ctl = blindScan(viewReveal(ST, SAMPLE, A, false), CHECK.tokens);
  rows.push({ name: 'blind', ok: null, ctl: ctl.length, text: '' });
  /* 4. EXPORT: passes calibrate.mjs's validator; a timestamped one does not */
  const x = buildExport(ST, SAMPLE, CAL.SCHEMA), v = CAL.validateExport(x);
  const bad = Object.assign({}, x, { savedAt: 'wall clock' }), vb = CAL.validateExport(bad);
  const qk = QUI.map(q => q.key).join() === CAL.QUESTIONS.map(q => q.key).join();
  rows.push({ name: 'export schema', ok: v.ok && !vb.ok && qk, text: `this pass's export validates (${v.ok ? 'yes' : 'NO: ' + v.errors[0]}), a timestamped one is rejected (${vb.ok ? 'MISSED' : 'caught'}), the questions match calibrate.mjs (${qk ? 'yes' : 'NO'})` });
  CHECK.rows = rows;
}
/* ?xverify=1 — the developer's cross-runtime pass: every patch rendered and measured HERE, as
   DIFFERENCES from the committed numbers (never the numbers), against TOL */
function crossVerify() {
  const lines = [], fmt = x => (x === null || x === undefined || !Number.isFinite(x) ? 'n/a' : 'Δ' + Math.abs(x).toExponential(1));
  let okN = 0;
  for (const it of SAMPLE.items) {
    const p = patchOf(it.key), sd = pseedOf(SAMPLE.run.seed, it.i), h = measureHeard(MET, ENG.C, p, sd, renderPhrase(ENG.C, p, sd).segs);
    const d = heardDiff(h, it.metrics); if (d.ok) okN++;
    lines.push(`${it.key.padEnd(12)} ${d.ok ? 'within ' : 'OUTSIDE'}  ` + Object.keys(TOL).map(k => `${k.slice(0, 5)} ${fmt(h[k] - it.metrics[k])}`).join('  ') +
      (d.ok ? '' : '  over: ' + d.over.map(o => `${o.k} x${o.over.toFixed(1)}`).join(', ')));
  }
  CHECK.xv = `CROSS-RUNTIME (developer, ?xverify=1): ${okN}/${SAMPLE.items.length} patches measure within tolerance here\n` + lines.join('\n');
}
function paintAudit() {
  const el = $('audit'); if (!el) return;
  if (ENG.err) { el.className = 'audit bad'; el.textContent = ENG.err; return; }
  if (!CHECK.rows.length) { el.textContent = ''; return; }
  const blind = CHECK.rows.find(r => r.name === 'blind');
  if (blind) {
    blind.ok = CHECK.blindHits.length === 0 && blind.ctl > 0;
    blind.text = ST.revealed ? `blind until the reveal (${CHECK.blindScans} scans before it, ${CHECK.blindHits.length} leaks)` :
      `the page shows no measurement (${CHECK.blindScans} scans, ${CHECK.blindHits.length} leaks); the reveal's own text trips the same scan (${blind.ctl > 0 ? 'caught' : 'MISSED'})`;
  }
  const n = CHECK.rows.filter(r => r.ok).length, hv = Object.values(ST.heard), drift = hv.filter(h => h === 'drift').length;
  el.className = 'audit' + (n === CHECK.rows.length ? '' : ' bad');
  el.innerHTML = `SELF-CHECKS <span class="${n === CHECK.rows.length ? 'ok' : 'no'}">${n}/${CHECK.rows.length}</span> · ` +
    CHECK.rows.map(r => `<span class="${r.ok ? 'ok' : 'no'}">${r.ok ? 'OK' : 'FAIL'}</span> ${esc(r.name)}: ${esc(r.text)}`).join(' · ') +
    ` · heard here so far: ${hv.length - drift} match, ${drift} drift` + (DEMO ? ' · <span class="demo">DEMO STATE, not saved</span>' : '') +
    (CHECK.xv ? '<pre class="cmd">' + esc(CHECK.xv) + '</pre>' : '');
}

/* ======================================================================
   F. BOOT
   ====================================================================== */
function applyTheme() {
  document.body.classList.toggle('dark', ST.theme === 'dark');
  const b = $('themeBtn'); if (b) b.innerHTML = 'theme <b>' + ST.theme.toUpperCase() + '</b>';
}
/* a screenshot state with SYNTHETIC answers (a seeded rater), labelled on screen and never saved */
function demoFill(upto) {
  const rng = mulberry32(0xDE30);
  ST.order.slice(0, upto).forEach(key => { const a = {}; for (const q of QUI) a[q.key] = rng() < 0.35 ? 1 : 0; ST.answers[key] = a; });
}
async function boot() {
  applyTheme();
  const tb = $('themeBtn'); if (tb) tb.onclick = () => { ST.theme = ST.theme === 'dark' ? 'light' : 'dark'; applyTheme(); };
  try { await loadAll(); } catch (e) {
    ENG.err = 'the page could not start: ' + String(e && e.message || e) + ' — serve the repo: python3 tools/serve_labs.py';
    paintAudit(); const app = $('app'); if (app) app.innerHTML = '<div class="card"><p>' + esc(ENG.err) + '</p></div>'; return;
  }
  ST.order = presentationOrder(SAMPLE.items, SAMPLE.orderSeed);
  CHECK.tokens = blindTokens(SAMPLE);
  if (DEMO === 'rate') { demoFill(6); ST.answers[ST.order[6]] = { aliased: 0, rough: 1, rootUnclear: 0 }; ST.cursor = 6; }
  else if (DEMO === 'reveal') { demoFill(ST.order.length); ST.revealed = true; }
  else { const s = load(); if (s) { ST.answers = s.answers || {}; ST.heard = s.heard || {}; ST.cursor = Math.min(s.cursor || 0, ST.order.length - 1); ST.revealed = !!s.revealed; } }
  try { selfChecks(); } catch (e) { CHECK.rows.push({ name: 'self-checks', ok: false, text: 'threw: ' + String(e && e.message || e) }); }
  if (XVERIFY) { try { crossVerify(); } catch (e) { CHECK.xv = 'cross-runtime pass threw: ' + String(e && e.message || e); } }
  document.addEventListener('keydown', onKey);
  if (DEMO === 'rate') { ST.view = 'rate'; render(); phraseOf(ST.order[ST.cursor]); setStat(statFor(ST.order[ST.cursor])); }
  else { ST.view = DEMO === 'reveal' || ST.revealed ? 'reveal' : 'intro'; render(); }
  paintAudit();
}
boot().catch(e => { ENG.err = 'boot failed: ' + String(e && e.stack || e); try { paintAudit(); } catch (_) {} });
</script>
